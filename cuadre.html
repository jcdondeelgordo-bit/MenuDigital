<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Donde el Gordo - Cuadre de Caja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#241407 0%,#170d06 55%,#120a04 100%);color:#f3e6d0;min-height:100vh;}

header{position:sticky;top:0;z-index:20;background:#170d06;border-bottom:1px solid rgba(202,161,83,0.3);padding:14px 18px;}
.header-titulo{font-family:'Poppins',sans-serif;font-size:1.2rem;font-weight:800;color:#caa153;letter-spacing:1px;}
.header-sub{font-size:0.72rem;color:#e6d3ac;letter-spacing:2px;}
.header-fecha{font-size:0.78rem;color:rgba(201,184,154,0.7);margin-top:4px;}

.tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap;}
.btn-tab{padding:10px 16px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.35);color:#f3e6d0;font-size:0.85rem;font-weight:600;cursor:pointer;}
.btn-tab.activa{background:#e0a53f;color:#1a0f07;border-color:transparent;}

main{padding:18px;max-width:560px;margin:0 auto;}
.vista{display:none;flex-direction:column;gap:14px;}
.vista.activa{display:flex;}

.card{background:rgba(255,255,255,0.05);border:1px solid rgba(202,161,83,0.25);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;}
.card h3{font-family:'Poppins',sans-serif;color:#caa153;font-size:1rem;}
label{font-size:0.82rem;color:rgba(201,184,154,0.85);display:block;margin-bottom:4px;}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(202,161,83,0.35);background:rgba(255,255,255,0.06);color:#fff;font-size:0.95rem;}
.btn-primario{padding:14px;border-radius:10px;background:#e0a53f;border:none;color:#1a0f07;font-weight:800;font-size:0.95rem;cursor:pointer;}
.fila-dato{display:flex;justify-content:space-between;font-size:0.9rem;padding:6px 0;border-top:1px solid rgba(255,255,255,0.06);}
.fila-dato.total{font-weight:800;color:#e0a53f;border-top:1px solid rgba(202,161,83,0.3);padding-top:10px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:0.85rem;font-weight:600;z-index:100;display:none;}
.toast.ok{background:rgba(70,180,100,0.9);color:#fff;}
.toast.error{background:rgba(224,80,80,0.9);color:#fff;}
body:not(.deg-rol-cajero) .btn-primario { display: none !important; }

#cortex-imprimir{display:none;}
@media print{
  header, .tabs, main{display:none;}
  #cortex-imprimir{display:block;position:static;width:80mm;padding:4mm;font-family:'Courier New',monospace;font-size:11px;color:#000;background:#fff;}
  .cortex-linea{margin:2px 0;}
  .cortex-centro{text-align:center;}
  .cortex-negrita{font-weight:700;}
  .cortex-separador{border-top:1px dashed #000;margin:6px 0;}
  .cortex-item{display:flex;justify-content:space-between;}
  @page{size:80mm auto;margin:0;}
}
</style>
</head>
<body>
<button id="btn-cerrar-sesion" onclick="cerrarSesionDeg()" style="position:fixed;top:8px;right:8px;z-index:999;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,0.4);border:1px solid rgba(202,161,83,0.4);color:#f3e6d0;font-size:0.72rem;cursor:pointer;">Cerrar sesión</button>
<script>
  let ROL_SESION_DEG = null;
  async function cargarSesionDeg() {
    try {
      const res = await fetch('/api/session');
      const data = await res.json();
      ROL_SESION_DEG = data.rol;
      if (ROL_SESION_DEG === 'cajero') document.body.classList.add('deg-rol-cajero');
    } catch (e) {}
  }
  async function cerrarSesionDeg() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login.html';
  }
  cargarSesionDeg();
</script>

<header>
  <div class="header-titulo">DONDE EL GORDO</div>
  <div class="header-sub">CUADRE DE CAJA</div>
  <div class="header-fecha" id="header-fecha"></div>
  <div style="margin-top:10px;">
    <label for="input-quien-registra" style="margin-bottom:2px;">¿Quién registra?</label>
    <input type="text" id="input-quien-registra" placeholder="Tu nombre" style="padding:8px 12px;font-size:0.85rem;">
  </div>
</header>

<div class="tabs">
  <button class="btn-tab activa" id="btn-pestana-apertura" onclick="cambiarPestana('apertura')">Abrir caja</button>
  <button class="btn-tab" id="btn-pestana-dia" onclick="cambiarPestana('dia')">Durante el día</button>
  <button class="btn-tab" id="btn-pestana-cierre" onclick="cambiarPestana('cierre')">Cerrar caja</button>
  <button class="btn-tab" id="btn-pestana-cortex" onclick="cambiarPestana('cortex')">Corte X</button>
</div>

<main>
  <div class="vista activa" id="vista-apertura">
    <div class="card">
      <h3>Base con la que arranca hoy</h3>
      <div id="apertura-sugerida" class="fila-dato">Cargando base sugerida...</div>
      <div>
        <label for="input-base-apertura">Confirmar o ajustar el valor</label>
        <input type="number" id="input-base-apertura" placeholder="0">
      </div>
      <button class="btn-primario" onclick="confirmarApertura()">Confirmar apertura</button>
    </div>
  </div>

  <div class="vista" id="vista-dia">
    <div class="card">
      <h3>Gasto (compra)</h3>
      <div>
        <label for="input-gasto-concepto">¿Qué se compró / dónde?</label>
        <input type="text" id="input-gasto-concepto" placeholder="Ej: Verduras - Plaza de mercado">
      </div>
      <div>
        <label for="input-gasto-monto">Valor</label>
        <input type="number" id="input-gasto-monto" placeholder="0">
      </div>
      <button class="btn-primario" onclick="registrarGasto()">Registrar gasto</button>
    </div>

    <div class="card">
      <h3>Pago a empleado</h3>
      <div>
        <label for="select-pago-empleado">Empleado</label>
        <select id="select-pago-empleado"><option value="">Cargando...</option></select>
      </div>
      <div>
        <label for="input-pago-monto">Valor</label>
        <input type="number" id="input-pago-monto" placeholder="0">
      </div>
      <button class="btn-primario" onclick="registrarPagoEmpleado()">Registrar pago</button>
    </div>

    <div class="card">
      <h3>Recogida parcial</h3>
      <div>
        <label for="input-recogida-quien">¿Quién recogió?</label>
        <input type="text" id="input-recogida-quien" placeholder="Ej: Jaime">
      </div>
      <div>
        <label for="input-recogida-monto">Valor</label>
        <input type="number" id="input-recogida-monto" placeholder="0">
      </div>
      <button class="btn-primario" onclick="registrarRecogida()">Registrar recogida</button>
    </div>

    <div class="card">
      <h3>Daño / sobrante</h3>
      <div>
        <label for="select-dano-tipo">Tipo</label>
        <select id="select-dano-tipo" onchange="cambiarTipoDano()">
          <option value="Producto">Producto terminado (ej. porción de pizza sobrante)</option>
          <option value="Insumo">Insumo crudo (ej. carne, pan)</option>
        </select>
      </div>
      <div>
        <label for="select-dano-nombre">Nombre</label>
        <select id="select-dano-nombre"><option value="">Cargando...</option></select>
      </div>
      <div>
        <label for="input-dano-cantidad">Cantidad</label>
        <input type="number" id="input-dano-cantidad" placeholder="0">
      </div>
      <div>
        <label for="input-dano-motivo">Motivo</label>
        <input type="text" id="input-dano-motivo" placeholder="Ej: Se quemó / Sobró al cierre">
      </div>
      <button class="btn-primario" onclick="registrarDano()">Registrar daño</button>
    </div>

    <div class="card">
      <h3>Ya registrado hoy</h3>
      <div id="lista-registros-dia">Cargando...</div>
    </div>
  </div>
  <div class="vista" id="vista-cierre">
    <div class="card">
      <h3>Resumen del día</h3>
      <div id="resumen-cierre">Cargando...</div>
      <div>
        <label for="input-efectivo-contado">Efectivo contado físicamente</label>
        <input type="number" id="input-efectivo-contado" placeholder="0">
      </div>
      <div id="resultado-cuadre"></div>
      <button class="btn-primario" onclick="confirmarCierre()">Cerrar caja</button>
    </div>
  </div>
  <div class="vista" id="vista-cortex">
    <div class="card">
      <h3>Corte X — venta acumulada de hoy</h3>
      <div>
        <label for="select-cortex-generado-por">¿Quién genera este corte?</label>
        <select id="select-cortex-generado-por"><option value="">Cargando...</option></select>
        <input type="text" id="input-cortex-generado-por-libre" placeholder="Escribe tu nombre" style="display:none;margin-top:8px;">
      </div>
      <button class="btn-primario" onclick="generarCorteX()">📋 Generar Corte X</button>
      <div id="resultado-cortex"></div>
      <button class="btn-primario" id="btn-imprimir-cortex" style="display:none;" onclick="imprimirCorteX()">🖨️ Imprimir / Guardar como PDF</button>
    </div>
  </div>
</main>

<div id="cortex-imprimir"></div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzo45isSgsJoCJxyvBl81Eb9fMAMwsB3GS5IRwV9QxTgk7NLfj8BiE8j5CgeP6dWgb6/exec';

function fechaHoy() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatoCOP(v) { return '$' + Math.round(v).toLocaleString('es-CO'); }

document.getElementById('header-fecha').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

function quienRegistra() { return document.getElementById('input-quien-registra').value.trim(); }

(function () {
  const inputQuien = document.getElementById('input-quien-registra');
  inputQuien.value = localStorage.getItem('cuadre_quien_registra') || '';
  inputQuien.addEventListener('input', function () {
    localStorage.setItem('cuadre_quien_registra', inputQuien.value);
  });
})();

function mostrarToast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + tipo;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function cambiarPestana(nombre) {
  ['apertura', 'dia', 'cierre', 'cortex'].forEach(n => {
    document.getElementById('vista-' + n).classList.toggle('activa', n === nombre);
    document.getElementById('btn-pestana-' + n).classList.toggle('activa', n === nombre);
  });
  if (nombre === 'dia') cargarRegistrosDia();
  if (nombre === 'cierre') cargarResumenCierre();
}

// --- Lectura: JSONP (mismo mecanismo ya usado por inventario.html) ---
function jsonpGet(accionYParams, callbackFn) {
  const callbackName = 'jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  window[callbackName] = function (response) {
    delete window[callbackName];
    const scriptNode = document.getElementById(callbackName);
    if (scriptNode) scriptNode.remove();
    callbackFn(response);
  };
  const script = document.createElement('script');
  script.id = callbackName;
  script.src = SCRIPT_URL + '?' + accionYParams + '&callback=' + callbackName;
  script.onerror = () => { delete window[callbackName]; script.remove(); callbackFn(null); };
  document.body.appendChild(script);
}

// --- Escritura: formulario oculto + iframe + verificación por JSONP (mismo mecanismo
// ya usado por inventario.html para evitar el límite de CORS en doPost) ---
function postToGoogleSheets(payload, onSuccess, onFail) {
  const idEnvio = payload.idEnvio;
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = SCRIPT_URL;
  const iframeName = 'iframe_' + Date.now();
  const iframe = document.createElement('iframe');
  iframe.name = iframeName;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);
  form.target = iframeName;
  form.style.display = 'none';

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'payload';
  input.value = JSON.stringify(payload);
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  setTimeout(() => {
    verifyTransactionReceipt(idEnvio, 0, () => {
      document.body.removeChild(iframe);
      onSuccess();
    }, () => {
      document.body.removeChild(iframe);
      if (onFail) onFail(); else mostrarToast('Error de conexión. Inténtalo de nuevo.', 'error');
    });
  }, 1500);
}

function verifyTransactionReceipt(idEnvio, attempt, onOk, onFail) {
  const callbackName = 'jsonpVerify_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  window[callbackName] = function (response) {
    delete window[callbackName];
    const scriptNode = document.getElementById(callbackName);
    if (scriptNode) scriptNode.remove();
    if (response && response.ok && response.confirmado) {
      onOk();
    } else if (attempt >= 6) {
      onFail();
    } else {
      setTimeout(() => verifyTransactionReceipt(idEnvio, attempt + 1, onOk, onFail), 1500);
    }
  };
  const script = document.createElement('script');
  script.id = callbackName;
  script.src = SCRIPT_URL + '?action=verificar_envio&id=' + encodeURIComponent(idEnvio) + '&callback=' + callbackName;
  script.onerror = () => {
    delete window[callbackName];
    script.remove();
    if (attempt >= 6) onFail(); else setTimeout(() => verifyTransactionReceipt(idEnvio, attempt + 1, onOk, onFail), 2000);
  };
  document.body.appendChild(script);
}

// --- Pestaña "Abrir caja" ---
function cargarBaseSugerida() {
  jsonpGet('action=sugerir_base_apertura&fecha=' + fechaHoy(), function (res) {
    if (!res || !res.ok) {
      document.getElementById('apertura-sugerida').textContent = 'No se pudo cargar la base sugerida — puedes escribirla a mano.';
      document.getElementById('input-base-apertura').value = '';
      return;
    }
    const sugerida = res.baseSugerida;
    document.getElementById('apertura-sugerida').textContent = 'Sugerida (efectivo contado ayer): ' + formatoCOP(sugerida);
    document.getElementById('input-base-apertura').value = sugerida;
  });
}

function confirmarApertura() {
  const base = parseFloat(document.getElementById('input-base-apertura').value) || 0;
  const idEnvio = 'env_' + Date.now();
  postToGoogleSheets({ action: 'abrir_caja', idEnvio: idEnvio, fecha: fechaHoy(), baseApertura: base, abiertoPor: quienRegistra() }, function () {
    mostrarToast('Caja abierta con base ' + formatoCOP(base), 'ok');
  });
}

let CATALOGO_PRODUCTOS = [];
let CATALOGO_INSUMOS = [];

function cargarEmpleadosSelect() {
  jsonpGet('action=listar_empleados', function (res) {
    const empleados = (res && res.ok && Array.isArray(res.empleados)) ? res.empleados : [];
    const elPago = document.getElementById('select-pago-empleado');
    elPago.innerHTML = empleados.length
      ? empleados.map(e => `<option value="${e.nombre.replace(/"/g, '&quot;')}">${e.nombre}</option>`).join('')
      : '<option value="">-- No hay empleados registrados --</option>';

    const elCortex = document.getElementById('select-cortex-generado-por');
    const inputLibre = document.getElementById('input-cortex-generado-por-libre');
    if (empleados.length) {
      elCortex.innerHTML = '<option value="">-- Selecciona --</option>' + empleados.map(e => `<option value="${e.nombre.replace(/"/g, '&quot;')}">${e.nombre}</option>`).join('');
      inputLibre.style.display = 'none';
    } else {
      elCortex.innerHTML = '<option value="">-- Sin catálogo --</option>';
      inputLibre.style.display = 'block';
    }
  });
}

function cargarCatalogosDano() {
  jsonpGet('action=get_productos', function (res) {
    CATALOGO_PRODUCTOS = (res && res.ok && Array.isArray(res.data)) ? res.data : [];
    if (document.getElementById('select-dano-tipo').value === 'Producto') renderOpcionesDano();
  });
  jsonpGet('action=listar_insumos', function (res) {
    CATALOGO_INSUMOS = (res && res.ok && Array.isArray(res.insumos)) ? res.insumos : [];
    if (document.getElementById('select-dano-tipo').value === 'Insumo') renderOpcionesDano();
  });
}

function renderOpcionesDano() {
  const tipo = document.getElementById('select-dano-tipo').value;
  const lista = tipo === 'Insumo' ? CATALOGO_INSUMOS : CATALOGO_PRODUCTOS;
  const el = document.getElementById('select-dano-nombre');
  el.innerHTML = lista.map(item => `<option value="${item.nombre.replace(/"/g, '&quot;')}">${item.nombre}</option>`).join('') || '<option value="">-- Sin catálogo --</option>';
}

function cambiarTipoDano() { renderOpcionesDano(); }

function registrarGasto() {
  const concepto = document.getElementById('input-gasto-concepto').value.trim();
  const monto = parseFloat(document.getElementById('input-gasto-monto').value) || 0;
  if (!concepto || !monto) { mostrarToast('Falta el concepto o el valor', 'error'); return; }
  postToGoogleSheets({ action: 'registrar_gasto_caja', idEnvio: 'env_' + Date.now(), fecha: fechaHoy(), concepto: concepto, monto: monto, registradoPor: quienRegistra() }, function () {
    mostrarToast('Gasto registrado: ' + formatoCOP(monto), 'ok');
    document.getElementById('input-gasto-concepto').value = '';
    document.getElementById('input-gasto-monto').value = '';
    cargarRegistrosDia();
  });
}

function registrarPagoEmpleado() {
  const empleado = document.getElementById('select-pago-empleado').value;
  const monto = parseFloat(document.getElementById('input-pago-monto').value) || 0;
  if (!empleado || !monto) { mostrarToast('Falta el empleado o el valor', 'error'); return; }
  postToGoogleSheets({ action: 'registrar_pago_empleado_caja', idEnvio: 'env_' + Date.now(), fecha: fechaHoy(), empleado: empleado, monto: monto, registradoPor: quienRegistra() }, function () {
    mostrarToast('Pago registrado: ' + formatoCOP(monto), 'ok');
    document.getElementById('input-pago-monto').value = '';
    cargarRegistrosDia();
  });
}

function registrarRecogida() {
  const quien = document.getElementById('input-recogida-quien').value.trim();
  const monto = parseFloat(document.getElementById('input-recogida-monto').value) || 0;
  if (!quien || !monto) { mostrarToast('Falta quién recogió o el valor', 'error'); return; }
  postToGoogleSheets({ action: 'registrar_recogida_caja', idEnvio: 'env_' + Date.now(), fecha: fechaHoy(), quien: quien, monto: monto, registradoPor: quienRegistra() }, function () {
    mostrarToast('Recogida registrada: ' + formatoCOP(monto), 'ok');
    document.getElementById('input-recogida-quien').value = '';
    document.getElementById('input-recogida-monto').value = '';
    cargarRegistrosDia();
  });
}

function registrarDano() {
  const tipo = document.getElementById('select-dano-tipo').value;
  const nombre = document.getElementById('select-dano-nombre').value;
  const cantidad = parseFloat(document.getElementById('input-dano-cantidad').value) || 0;
  const motivo = document.getElementById('input-dano-motivo').value.trim();
  if (!nombre || !cantidad) { mostrarToast('Falta el nombre o la cantidad', 'error'); return; }
  postToGoogleSheets({ action: 'registrar_dano', idEnvio: 'env_' + Date.now(), fecha: fechaHoy(), tipo: tipo, nombre: nombre, cantidad: cantidad, motivo: motivo, registradoPor: quienRegistra() }, function () {
    mostrarToast('Daño registrado: ' + cantidad + ' x ' + nombre, 'ok');
    document.getElementById('input-dano-cantidad').value = '';
    document.getElementById('input-dano-motivo').value = '';
    cargarRegistrosDia();
  });
}

function cargarRegistrosDia() {
  jsonpGet('action=listar_registros_dia_caja&fecha=' + fechaHoy(), function (res) {
    const el = document.getElementById('lista-registros-dia');
    if (!res || !res.ok) { el.textContent = 'No se pudo cargar.'; return; }
    const r = res.registros;
    const filas = []
      .concat(r.gastos.map(g => `Gasto: ${g.concepto} — ${formatoCOP(g.monto)}`))
      .concat(r.pagos.map(p => `Pago: ${p.empleado} — ${formatoCOP(p.monto)}`))
      .concat(r.recogidas.map(c => `Recogida: ${c.quien} — ${formatoCOP(c.monto)}`))
      .concat(r.danos.map(d => `Daño (${d.tipo}): ${d.cantidad} x ${d.nombre}${d.motivo ? ' — ' + d.motivo : ''}`));
    el.innerHTML = filas.length ? filas.map(f => `<div class="fila-dato">${f}</div>`).join('') : 'Nada registrado todavía hoy.';
  });
}

cargarEmpleadosSelect();
cargarCatalogosDano();
renderOpcionesDano();
cargarBaseSugerida();

let ULTIMO_RESUMEN = null;

function cargarResumenCierre() {
  jsonpGet('action=resumen_dia_caja&fecha=' + fechaHoy(), function (res) {
    const el = document.getElementById('resumen-cierre');
    if (!res || !res.ok) { el.textContent = 'No se pudo cargar el resumen.'; return; }
    ULTIMO_RESUMEN = res.resumen;
    const r = ULTIMO_RESUMEN;
    if (r.cajaAbierta === false) {
      el.innerHTML = `<div class="fila-dato">Primero abre la caja de hoy en la pestaña "Abrir caja".</div>`;
      return;
    }
    let aviso = '';
    if (r.ventasLeidas === false) {
      aviso = `<div class="fila-dato" style="color:#e05050;font-weight:700;">⚠️ No se pudieron leer las ventas del día — el resumen de abajo NO incluye la venta total real. No cierres la caja hasta resolver esto.</div>`;
    }
    el.innerHTML = aviso + `
      <div class="fila-dato"><span>Venta total</span><span>${formatoCOP(r.ventaTotal)}</span></div>
      <div class="fila-dato"><span>Base de apertura</span><span>${formatoCOP(r.baseApertura)}</span></div>
      <div class="fila-dato"><span>- Gastos</span><span>${formatoCOP(r.totalGastos)}</span></div>
      <div class="fila-dato"><span>- Pagos a empleados</span><span>${formatoCOP(r.totalPagosEmpleados)}</span></div>
      <div class="fila-dato"><span>- Recogidas</span><span>${formatoCOP(r.totalRecogidas)}</span></div>
      <div class="fila-dato"><span>- Nequi</span><span>${formatoCOP(r.nequi)}</span></div>
      <div class="fila-dato"><span>- Tarjeta</span><span>${formatoCOP(r.tarjeta)}</span></div>
      <div class="fila-dato total"><span>Nueva base esperada</span><span>${formatoCOP(r.nuevaBaseEsperada)}</span></div>
    `;
    calcularFaltanteSobrante();
  });
}

function calcularFaltanteSobrante() {
  if (!ULTIMO_RESUMEN) return;
  const contado = parseFloat(document.getElementById('input-efectivo-contado').value) || 0;
  const diferencia = Math.round((contado - ULTIMO_RESUMEN.nuevaBaseEsperada) * 100) / 100;
  const el = document.getElementById('resultado-cuadre');
  if (!document.getElementById('input-efectivo-contado').value) { el.innerHTML = ''; return; }
  const etiqueta = diferencia === 0 ? 'CUADRA EXACTO' : (diferencia > 0 ? 'SOBRÓ ' + formatoCOP(diferencia) : 'FALTÓ ' + formatoCOP(Math.abs(diferencia)));
  el.innerHTML = `<div class="fila-dato total"><span>${etiqueta}</span></div>`;
}

document.getElementById('input-efectivo-contado').addEventListener('input', calcularFaltanteSobrante);

function confirmarCierre() {
  const valorCrudo = document.getElementById('input-efectivo-contado').value;
  if (valorCrudo === '') { mostrarToast('Falta el efectivo contado', 'error'); return; }
  if (ULTIMO_RESUMEN && ULTIMO_RESUMEN.cajaAbierta === false) {
    mostrarToast('Primero abre la caja de hoy en la pestaña "Abrir caja"', 'error');
    return;
  }
  if (ULTIMO_RESUMEN && ULTIMO_RESUMEN.ventasLeidas === false) {
    mostrarToast('No se pudieron leer las ventas del día. No se puede cerrar la caja todavía.', 'error');
    return;
  }
  const contado = parseFloat(valorCrudo) || 0;
  postToGoogleSheets({ action: 'cerrar_caja', idEnvio: 'env_' + Date.now(), fecha: fechaHoy(), efectivoContado: contado, cerradoPor: quienRegistra() }, function () {
    mostrarToast('Caja cerrada. Efectivo contado: ' + formatoCOP(contado), 'ok');
    cargarResumenCierre();
  });
}

let ULTIMO_CORTE_X = null;

function nombreCortexSeleccionado() {
  const select = document.getElementById('select-cortex-generado-por').value;
  if (select) return select;
  return document.getElementById('input-cortex-generado-por-libre').value.trim();
}

function generarCorteX() {
  const nombre = nombreCortexSeleccionado();
  if (!nombre) { mostrarToast('Selecciona o escribe quién genera el corte', 'error'); return; }

  document.getElementById('resultado-cortex').innerHTML = '<div class="fila-dato">Calculando...</div>';
  document.getElementById('btn-imprimir-cortex').style.display = 'none';

  jsonpGet('action=generar_corte_x&fecha=' + fechaHoy() + '&generadoPor=' + encodeURIComponent(nombre), function (res) {
    if (!res || !res.ok) {
      document.getElementById('resultado-cortex').innerHTML = '<div class="fila-dato">No se pudo generar el corte. Intenta de nuevo.</div>';
      return;
    }
    ULTIMO_CORTE_X = res.data;
    renderCorteX(res.data);
    document.getElementById('btn-imprimir-cortex').style.display = 'block';
  });
}

function renderCorteX(data) {
  const el = document.getElementById('resultado-cortex');
  let aviso = '';
  if (data.ventasLeidas === false) {
    aviso = '<div class="fila-dato" style="color:#e05050;font-weight:700;">⚠️ No se pudieron leer las ventas del Menú — este corte no es confiable, vuelve a intentar.</div>';
  }
  const horaLocal = new Date(data.hora).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  const productos = Object.keys(data.porProducto).sort((a, b) => data.porProducto[b].total - data.porProducto[a].total);
  const filasProducto = productos.length
    ? productos.map(p => `<div class="fila-dato"><span>${data.porProducto[p].cantidad}x ${p}</span><span>${formatoCOP(data.porProducto[p].total)}</span></div>`).join('')
    : '<div class="fila-dato">Sin ventas pagadas todavía hoy.</div>';
  el.innerHTML = aviso + `
    <div class="fila-dato"><span>Generado por</span><span>${data.generadoPor}</span></div>
    <div class="fila-dato"><span>Hora del corte</span><span>${horaLocal}</span></div>
    <div class="cortex-separador-visual" style="border-top:1px solid rgba(255,255,255,0.06);margin:8px 0;"></div>
    ${filasProducto}
    <div class="fila-dato total"><span>TOTAL VENDIDO</span><span>${formatoCOP(data.totalVenta)}</span></div>
    <div class="fila-dato"><span>Efectivo</span><span>${formatoCOP(data.porMetodo.Efectivo)}</span></div>
    <div class="fila-dato"><span>Nequi</span><span>${formatoCOP(data.porMetodo.Nequi)}</span></div>
    <div class="fila-dato"><span>Tarjeta</span><span>${formatoCOP(data.porMetodo.Tarjeta)}</span></div>
    ${Object.keys(data.porCanal).map(c => `<div class="fila-dato"><span>${c}</span><span>${formatoCOP(data.porCanal[c])}</span></div>`).join('')}
  `;
}

function imprimirCorteX() {
  if (!ULTIMO_CORTE_X) return;
  const data = ULTIMO_CORTE_X;
  const horaLocal = new Date(data.hora).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  const productos = Object.keys(data.porProducto).sort((a, b) => data.porProducto[b].total - data.porProducto[a].total);
  const cont = document.getElementById('cortex-imprimir');
  cont.innerHTML = `
    <div class="cortex-linea cortex-centro cortex-negrita">DONDE EL GORDO</div>
    <div class="cortex-linea cortex-centro">CORTE X</div>
    <div class="cortex-separador"></div>
    <div class="cortex-linea">${data.fecha}  ${horaLocal}</div>
    <div class="cortex-linea">Generado por: ${data.generadoPor}</div>
    <div class="cortex-separador"></div>
    ${productos.map(p => `<div class="cortex-item"><span>${data.porProducto[p].cantidad}x ${p}</span><span>${formatoCOP(data.porProducto[p].total)}</span></div>`).join('')}
    <div class="cortex-separador"></div>
    <div class="cortex-item cortex-negrita"><span>TOTAL</span><span>${formatoCOP(data.totalVenta)}</span></div>
    <div class="cortex-item"><span>Efectivo</span><span>${formatoCOP(data.porMetodo.Efectivo)}</span></div>
    <div class="cortex-item"><span>Nequi</span><span>${formatoCOP(data.porMetodo.Nequi)}</span></div>
    <div class="cortex-item"><span>Tarjeta</span><span>${formatoCOP(data.porMetodo.Tarjeta)}</span></div>
    <div class="cortex-separador"></div>
    ${Object.keys(data.porCanal).map(c => `<div class="cortex-item"><span>${c}</span><span>${formatoCOP(data.porCanal[c])}</span></div>`).join('')}
  `;
  window.print();
}
</script>
