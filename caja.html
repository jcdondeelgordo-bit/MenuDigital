<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Donde el Gordo - Caja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
input,textarea,select{-webkit-user-select:text;user-select:text;}
body{font-family:'Inter',sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#241407 0%,#170d06 55%,#120a04 100%);color:#f3e6d0;min-height:100vh;}

header{position:sticky;top:0;z-index:20;background:#170d06;border-bottom:1px solid rgba(202,161,83,0.3);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;row-gap:14px;}
.header-titulo{font-family:'Poppins',sans-serif;font-size:1.2rem;font-weight:800;color:#caa153;letter-spacing:1px;white-space:nowrap;}
.header-sub{font-size:0.72rem;color:#e6d3ac;letter-spacing:2px;}
.header-tabs{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.grupo-tabs{display:flex;gap:8px;}
.btn-tab{padding:12px 22px;border-radius:24px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.4);color:#f3e6d0;font-size:0.88rem;font-weight:700;cursor:pointer;}
.btn-tab.activa{background:#e0a53f;color:#1a0f07;border-color:transparent;}

main{padding:18px;max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,400px));justify-content:center;gap:16px;}
.vacio-msg{grid-column:1/-1;text-align:center;color:rgba(201,184,154,0.5);padding:60px 0;font-size:1rem;}
.banner-mock{grid-column:1/-1;background:#170d06;border:1px solid #e05050;color:#e8a0a0;border-radius:10px;padding:12px 16px;font-size:0.85rem;font-weight:700;text-align:center;}

.pedido-card{background:rgba(255,255,255,0.05);border:1px solid rgba(202,161,83,0.25);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.pedido-header{display:flex;justify-content:space-between;align-items:flex-start;}
.pedido-titulo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.05rem;color:#caa153;}
.pedido-sub{font-size:0.8rem;color:rgba(201,184,154,0.75);margin-top:2px;}
.pedido-hora{font-size:0.78rem;color:rgba(201,184,154,0.6);text-align:right;}
.badge-estado{padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;display:inline-block;margin-top:6px;}
.badge-estado.pendiente{background:rgba(224,80,80,0.2);color:#e8a0a0;}
.badge-estado.pagado{background:rgba(70,180,100,0.25);color:#5fd489;}

.item-row{display:flex;align-items:center;gap:14px;padding:9px 12px;margin:0 -12px;font-size:0.88rem;}
.item-row:nth-child(odd){background:rgba(255,255,255,0.035);}
.item-row:nth-child(even){background:rgba(0,0,0,0.16);}
.item-row>span:first-child{flex:1;min-width:0;}
.item-row>span:last-child{flex:none;color:#e0a53f;font-weight:700;}
.pedido-total-row{display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid rgba(202,161,83,0.3);font-weight:800;color:#e0a53f;}
.pedido-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.btn-cobrar{padding:10px 16px;border-radius:10px;background:#e0a53f;border:none;color:#1a0f07;font-weight:700;font-size:0.85rem;cursor:pointer;}

.overlay-division{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:60;padding:24px 12px;}
.overlay-division.oculto{display:none;}
.panel-division{background:#241408;border:1px solid rgba(202,161,83,0.4);border-radius:16px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;}
.panel-division h3{font-family:'Poppins',sans-serif;color:#e0a53f;font-size:1.15rem;}
.division-modos{display:flex;gap:8px;}
.btn-modo{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.35);color:#f3e6d0;font-size:0.85rem;font-weight:700;cursor:pointer;}
.btn-modo.activo{background:#e0a53f;color:#1a0f07;border-color:transparent;}
.division-seccion{display:flex;flex-direction:column;gap:8px;}
.division-seccion h4{color:#e6d3ac;font-size:0.8rem;letter-spacing:1px;text-transform:uppercase;}
.parte-cobrada{display:flex;justify-content:space-between;font-size:0.85rem;color:rgba(201,184,154,0.8);padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.producto-stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.88rem;}
.producto-stepper .info{display:flex;flex-direction:column;}
.producto-stepper .disponible{font-size:0.72rem;color:rgba(201,184,154,0.5);}
.stepper-controles{display:flex;align-items:center;gap:10px;}
.btn-stepper{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(202,161,83,0.35);color:#f3e6d0;font-size:1.1rem;font-weight:700;cursor:pointer;}
.input-nombre{padding:10px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.35);color:#fff;font-size:0.9rem;}
.division-subtotal{display:flex;justify-content:space-between;font-weight:800;color:#e0a53f;font-size:1rem;padding-top:8px;border-top:1px solid rgba(202,161,83,0.3);}
.parte-igual-card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid rgba(202,161,83,0.25);border-radius:10px;}

.overlay-vr{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:60;padding:24px 12px;}
.overlay-vr.oculto{display:none;}
.panel-vr{background:#241408;border:1px solid rgba(202,161,83,0.4);border-radius:16px;padding:20px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;}
.panel-vr h3{font-family:'Poppins',sans-serif;color:#e0a53f;font-size:1.15rem;}
.vr-categorias{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.vr-cat-pill{flex:none;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.3);color:#f3e6d0;font-size:0.85rem;white-space:nowrap;cursor:pointer;}
.vr-cat-pill.activa{color:#fff;font-weight:700;border-color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,0.25) inset;}
.vr-productos-lista{max-width:480px;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid rgba(202,161,83,0.2);}
.vr-producto-row{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:0.88em;}
.vr-producto-row:nth-child(odd){background:rgba(255,255,255,0.035);}
.vr-producto-row:nth-child(even){background:rgba(0,0,0,0.16);}
.vr-producto-nombre{flex:1;min-width:0;}
.vr-producto-accion{flex:none;display:flex;align-items:center;gap:12px;}
.vr-producto-precio{color:#e0a53f;font-weight:700;}
.vr-carrito-item{display:flex;align-items:center;gap:14px;padding:8px 12px;margin:0 -12px;font-size:0.88rem;}
.vr-carrito-item:nth-child(odd){background:rgba(255,255,255,0.035);}
.vr-carrito-item:nth-child(even){background:rgba(0,0,0,0.16);}
.vr-vacio{font-size:0.8rem;color:rgba(201,184,154,0.5);padding:6px 0;}
.vr-tamano-control{display:flex;align-items:center;gap:10px;padding:6px 2px 0;}
.vr-tamano-label{font-size:0.8rem;color:#e6d3ac;white-space:nowrap;}
.vr-tamano-valor{font-size:0.8rem;color:#e0a53f;font-weight:700;min-width:38px;text-align:right;}
#vr-tamano-slider{flex:1;accent-color:#e0a53f;height:4px;}

#overlay-cobrar{z-index:65;}
#overlay-cobrar-parcial{z-index:70;}
#overlay-cobrar-vr{z-index:68;}
#overlay-vr-carrito{z-index:63;background:rgba(0,0,0,0.35);}
.vr-carrito-flotante{position:fixed;bottom:16px;left:16px;z-index:61;background:#e0a53f;color:#1a0f07;border:none;border-radius:24px;padding:10px 16px;font-weight:800;font-size:0.85rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.4);display:flex;align-items:center;gap:6px;}
.vr-carrito-flotante.oculto{display:none;}

#recibo-imprimir{display:none;}
@media print{
  header, main, .overlay, .overlay-vr, .overlay-division, .vr-carrito-flotante{display:none;}
  #recibo-imprimir{display:block;position:static;width:80mm;padding:4mm;font-family:'Courier New',monospace;font-size:11px;color:#000;background:#fff;}
  .recibo-linea{margin:2px 0;}
  .recibo-centro{text-align:center;}
  .recibo-negrita{font-weight:700;}
  .recibo-separador{border-top:1px dashed #000;margin:6px 0;}
  .recibo-item{display:flex;justify-content:space-between;}
  @page{size:80mm auto;margin:0;}
}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;}
.overlay.oculto{display:none;}
.modal-cobrar{background:#241408;border:1px solid rgba(202,161,83,0.4);border-radius:16px;padding:24px;width:90%;max-width:340px;display:flex;flex-direction:column;gap:12px;}
.modal-cobrar h3{font-family:'Poppins',sans-serif;color:#e0a53f;font-size:1.1rem;}
.btn-metodo{padding:14px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.35);color:#f3e6d0;font-size:0.95rem;font-weight:700;cursor:pointer;}
.btn-cancelar{padding:12px;border-radius:10px;background:transparent;border:none;color:rgba(201,184,154,0.6);font-size:0.85rem;cursor:pointer;}

/* Pantalla de grid (mesas + domicilios) -- rediseño 2026-07-30 */
.header-marca{display:flex;align-items:center;gap:10px;flex:none;min-width:max-content;}
.logo-caja{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;}
.pantalla-grid{grid-column:1/-1;display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto;width:100%;}
.grid-titulo{font-family:'Poppins',sans-serif;font-size:1.15rem;color:#caa153;font-weight:700;display:flex;align-items:center;gap:8px;}
.grid-mesas,.grid-domicilios{display:grid;grid-template-columns:repeat(7,1fr);gap:16px;}
@media (max-width:820px){.grid-mesas,.grid-domicilios{grid-template-columns:repeat(5,1fr);gap:10px;}}
.btn-mesa,.btn-domicilio{aspect-ratio:1;border-radius:16px;background:transparent;font-weight:800;font-size:0.72rem;letter-spacing:0.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:border-color .2s,background .2s;}
.btn-mesa-num{font-size:1.55rem;line-height:1;font-weight:800;}
.btn-mesa.estado-libre{border:1.5px solid rgba(202,161,83,0.3);color:#f3e6d0;background:rgba(255,255,255,0.02);}
.btn-mesa.estado-ocupada-pendiente{border:1.5px solid #e05050;background:rgba(224,80,80,0.14);color:#ffb3b3;}
.btn-mesa.estado-ocupada-pagada{border:1.5px solid #e0a53f;background:rgba(224,165,63,0.16);color:#e0a53f;}
.btn-domicilio.estado-dom-libre{border:1.5px solid rgba(90,190,140,0.4);background:rgba(42,153,104,0.12);color:#8fd4b0;}
.btn-domicilio.estado-dom-ocupada-pendiente{border:1.5px solid #e05050;background:rgba(224,80,80,0.14);color:#ffb3b3;}
.btn-domicilio.estado-dom-ocupada-pagada{border:1.5px solid #e0a53f;background:rgba(224,165,63,0.16);color:#e0a53f;}
.btn-domicilio[disabled]{opacity:0.45;cursor:default;border-style:dashed;}
.linea-divisoria{height:1px;background:rgba(202,161,83,0.3);margin:2px 0;}
.franja-espera{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border:1px dashed rgba(202,161,83,0.4);border-radius:12px;}
.franja-espera-titulo{font-size:0.78rem;color:#e6d3ac;font-weight:700;width:100%;}
.btn-espera{padding:8px 14px;border-radius:10px;background:rgba(224,80,80,0.25);color:#e8a0a0;border:1px solid rgba(224,80,80,0.4);font-weight:700;cursor:pointer;font-size:0.8rem;}
.modal-detalle{background:#241408;border:1px solid rgba(202,161,83,0.4);border-radius:16px;padding:20px;width:92%;max-width:420px;max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.modal-detalle h3{font-family:'Poppins',sans-serif;color:#e0a53f;font-size:1.1rem;}
.ronda-bloque{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);}
.ronda-header{display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:rgba(201,184,154,0.65);margin-bottom:4px;}
.btn-liberar{padding:10px 16px;border-radius:10px;background:transparent;border:1px solid rgba(224,80,80,0.5);color:#e8a0a0;font-size:0.85rem;font-weight:700;cursor:pointer;}
.historial-filtros{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px;}
.seccion-recoger{display:flex;flex-direction:column;gap:8px;}
.btn-recoger{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(202,161,83,0.1);border:1px solid rgba(202,161,83,0.35);color:#f3e6d0;font-size:0.88rem;font-weight:700;cursor:pointer;text-align:left;width:100%;}
body:not(.deg-rol-cajero) .btn-cobrar,
body:not(.deg-rol-cajero) .btn-liberar,
body:not(.deg-rol-cajero) .btn-metodo,
body:not(.deg-rol-cajero) #btn-venta-rapida { display: none !important; }
</style>
</head>
<body>
<button id="btn-cerrar-sesion" onclick="cerrarSesionDeg()" style="position:fixed;top:8px;right:8px;z-index:999;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,0.4);border:1px solid rgba(202,161,83,0.4);color:#f3e6d0;font-size:0.72rem;cursor:pointer;">Cerrar sesión</button>
<script>
  let ROL_SESION_DEG = null;
  async function cargarSesionDeg() {
    try {
      const res = await fetch('/api/session');
      const data = await res.json();
      ROL_SESION_DEG = data.rol;
      if (ROL_SESION_DEG === 'cajero') document.body.classList.add('deg-rol-cajero');
    } catch (e) {}
  }
  async function cerrarSesionDeg() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login.html';
  }
  cargarSesionDeg();
</script>

<header>
  <div class="header-marca">
    <img class="logo-caja" src="logo.png" alt="Donde el Gordo">
    <div>
      <div class="header-titulo">DONDE EL GORDO</div>
      <div class="header-sub">CAJA</div>
    </div>
  </div>
  <div class="header-tabs">
    <button class="btn-tab" id="btn-venta-rapida" onclick="abrirVentaRapida()">Venta Rápida</button>
    <a class="btn-tab" href="menu.html" style="text-decoration:none;display:inline-flex;align-items:center;">Menú Cliente</a>
    <button class="btn-tab activa" onclick="cambiarVistaPrincipal('grid')">Mesas</button>
    <a class="btn-tab" href="cocina.html" style="text-decoration:none;display:inline-flex;align-items:center;">Cocina</a>
    <a class="btn-tab" href="inventario.html" style="text-decoration:none;display:inline-flex;align-items:center;">Inventario</a>
    <a class="btn-tab" href="empleados.html" style="text-decoration:none;display:inline-flex;align-items:center;">Empleados</a>
  </div>
  <div class="header-tabs">
    <button class="btn-tab" id="btn-vista-historial" onclick="cambiarVistaPrincipal(vistaPrincipal === 'grid' ? 'historial' : 'grid')">🕒 Historial de hoy</button>
    <a class="btn-tab" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center;">← MENU</a>
  </div>
</header>

<main id="lista-pedidos"></main>

<div class="overlay oculto" id="overlay-cobrar">
  <div class="modal-cobrar">
    <h3>¿Cómo pagó el cliente?</h3>
    <button class="btn-metodo" onclick="confirmarCobro('Efectivo')">💵 Efectivo</button>
    <button class="btn-metodo" onclick="confirmarCobro('Nequi')">📱 Nequi</button>
    <button class="btn-metodo" onclick="confirmarCobro('Tarjeta')">💳 Tarjeta</button>
    <button class="btn-cancelar" onclick="cerrarModalCobrar()">Cancelar</button>
  </div>
</div>

<div class="overlay oculto" id="overlay-detalle">
  <div class="modal-detalle" id="detalle-contenido"></div>
</div>

<div class="overlay-division oculto" id="overlay-division">
  <div class="panel-division">
    <h3>Dividir cuenta</h3>
    <div id="division-restante" style="font-size:0.85rem;color:rgba(201,184,154,0.8);"></div>

    <div class="division-seccion">
      <h4>Ya cobrado</h4>
      <div id="division-partes-cobradas"></div>
    </div>

    <div class="division-modos">
      <button class="btn-modo activo" id="btn-modo-item" onclick="cambiarModoDivision('item')">Por ítem</button>
      <button class="btn-modo" id="btn-modo-igual" onclick="cambiarModoDivision('igual')">Partes iguales</button>
    </div>

    <div class="division-seccion" id="division-modo-item" style="display:flex;">
      <h4>¿Quién paga ahora?</h4>
      <input type="text" class="input-nombre" id="input-nombre-persona" placeholder="Nombre de la persona">
      <div id="division-productos"></div>
      <div class="division-subtotal">
        <span>Subtotal de esta caja</span>
        <span id="division-subtotal-caja">$0</span>
      </div>
      <button class="btn-cobrar" onclick="iniciarCobroCajaItem()">Cobrar a esta persona</button>
    </div>

    <div class="division-seccion" id="division-modo-igual" style="display:none;">
      <h4>Dividir entre</h4>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="number" class="input-n-partes" id="input-n-partes" min="2" value="2" style="width:60px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.35);color:#fff;font-size:0.9rem;text-align:center;">
        <button class="btn-modo" onclick="generarPartesIguales()">Generar</button>

      <div id="division-partes-iguales-lista"></div>

    <button class="btn-cancelar" onclick="cerrarDivision()">Cerrar</button>
  </div>
</div>

<div class="overlay oculto" id="overlay-cobrar-parcial">
  <div class="modal-cobrar">
    <h3>¿Cómo pagó esta parte?</h3>
    <button class="btn-metodo" onclick="confirmarCobroParcial('Efectivo')">💵 Efectivo</button>
    <button class="btn-metodo" onclick="confirmarCobroParcial('Nequi')">📱 Nequi</button>
    <button class="btn-metodo" onclick="confirmarCobroParcial('Tarjeta')">💳 Tarjeta</button>
    <button class="btn-cancelar" onclick="cerrarModalCobrarParcial()">Cancelar</button>
  </div>
</div>

<div class="overlay-vr oculto" id="overlay-vr">
  <div class="panel-vr">
    <h3>🧾 Venta Rápida</h3>
    <div class="vr-categorias" id="vr-categorias"></div>
    <div id="vr-productos" style="font-size:calc(1em * var(--vr-escala, 1));"></div>
    <div class="vr-tamano-control">
      <span class="vr-tamano-label">🔎 Tamaño de letra</span>
      <input type="range" id="vr-tamano-slider" min="90" max="150" step="5" value="100" oninput="cambiarTamanoVR(this.value)">
      <span class="vr-tamano-valor" id="vr-tamano-valor">100%</span>

    <button class="btn-cancelar" onclick="cerrarVentaRapida()">Cancelar</button>
  </div>
</div>

<button class="vr-carrito-flotante oculto" id="vr-carrito-flotante" onclick="abrirCarritoPanelVR()">
  🛒 <span id="vr-flotante-badge">0</span> · <span id="vr-flotante-total">$0</span>
</button>

<div class="overlay-vr oculto" id="overlay-vr-carrito">
  <div class="panel-vr">
    <h3>🛒 Carrito</h3>
    <div id="vr-carrito"></div>
    <div class="division-subtotal">
      <span>Total</span>
      <span id="vr-total">$0</span>
    </div>
    <button class="btn-cobrar" onclick="iniciarCobroVentaRapida(true)">Cobrar y entregar</button>
    <button class="btn-cobrar" onclick="iniciarCobroVentaRapida(false)">Cobrar y dejar para recoger</button>
    <button class="btn-cancelar" onclick="cerrarCarritoPanelVR()">Cerrar</button>
  </div>

<script>
const SCRIPT_URL = '/api/proxy-menu';
const INTERVALO_POLLING_MS = 12000;

// Datos del local para el recibo de 80mm. Pendiente: el usuario dijo que trae
// la razón social y el NIT reales el 2026-07-27 — actualizar aquí en cuanto
// los tenga. Teléfono real ya confirmado.
const DATOS_LOCAL = {

};

// Datos de muestra para poder ver y probar la pantalla mientras el backend
// (modulo-9-apps-script-caja.gs.txt) no esté desplegado todavía.
function pedidosMock() {
  const ahora = new Date();

  ];
}

let pedidos = [];
let vistaTipo = 'local';
let vistaEstado = 'pendientes';
let pedidoIdParaCobrar = null;
let usandoDatosMuestra = false;
const pedidosPagoPendiente = new Set();

// Pantalla de grid (mesas + domicilios) -- rediseño 2026-07-30.
let vistaPrincipal = 'grid'; // 'grid' | 'historial'
let mesaAbierta = null;      // número de mesa mostrado en el panel de detalle, o null
let domicilioAbierto = null; // id_pedido de domicilio mostrado en el panel de detalle, o null
let mostradorAbierto = null; // id_pedido de mostrador (Venta Rápida) mostrado en el panel de detalle, o null
let cobroModo = 'individual'; // 'individual' (domicilio) | 'mesa' (varias rondas combinadas)
let mesaParaCobrar = null;
// Ids de ronda verificados (sin pagos parciales en curso) y mostrados al cajero
// en el momento de abrir el modal de método de pago -- confirmarCobroMesa cobra
// exactamente esta lista, nunca una relectura fresca de "pendientes" en vivo
// (ver hallazgo 2 de la revisión final: evita cobrar una ronda que llegó por
// polling mientras el modal ya estaba abierto y nunca fue verificada/mostrada).
let idsParaCobrarMesa = [];
let domicilioCupos = {}; // id_pedido -> número de cupo (1-5), persistido en localStorage
// Mismo mecanismo que pedidosPagoPendiente (ver aplicarPendientes) pero para
// una liberación en curso: evita que el polling automático le devuelva
// 'Pagado' a un pedido que el cajero ya marcó 'Liberado' optimistamente,
// mientras la petición liberar_mesa/liberar_pedido sigue en vuelo.
const pedidosLiberacionPendiente = new Set();

function cargarCuposDomicilio() {
  try { domicilioCupos = JSON.parse(localStorage.getItem('degCajaCuposDomicilio') || '{}'); }
  catch (e) { domicilioCupos = {}; }
}

function guardarCuposDomicilio() {
  try { localStorage.setItem('degCajaCuposDomicilio', JSON.stringify(domicilioCupos)); } catch (e) {}
}

// Cupos "pegajosos": un pedido que ya tenía cupo lo conserva aunque otro se
// libere antes (no se renumeran). Los nuevos reciben el primer cupo libre;
// si no hay ninguno, quedan en la franja de espera hasta que se libere uno.
function actualizarCuposDomicilio() {
  const activos = pedidos.filter(p => p.tipo === 'domicilio' && p.estado !== 'Liberado');
  const idsActivos = new Set(activos.map(p => p.id_pedido));

  Object.keys(domicilioCupos).forEach(id => {
    if (!idsActivos.has(id)) delete domicilioCupos[id];
  });

  const ocupados = new Set(Object.values(domicilioCupos));
  activos.slice().sort((a, b) => a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0).forEach(p => {
    if (domicilioCupos[p.id_pedido]) return;
    for (let slot = 1; slot <= 5; slot++) {
      if (!ocupados.has(slot)) { domicilioCupos[p.id_pedido] = slot; ocupados.add(slot); break; }
    }
  });

  guardarCuposDomicilio();
}

function estadoMesaColor(numMesa) {
  const activos = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(numMesa) && p.estado !== 'Liberado');
  if (activos.length === 0) return 'libre';
  if (activos.some(p => p.estado === 'Pendiente de pago')) return 'ocupada-pendiente';
  return 'ocupada-pagada';
}

// Estado de la vista "Dividir cuenta" (Módulo 4). Todo esto vive solo en memoria
// del navegador — nunca se guarda en Ventas. Lo único que se persiste es el
// resultado de cada caja ya cobrada, vía registrar_pago_parcial.
let division = null;
let idPedidoParaCobrarParcial = null;
let personaParaCobrarParcial = '';
let montoParaCobrarParcial = 0;
let detalleParaCobrarParcial = '';

async function abrirDivision(idPedido) {
  const pedido = pedidos.find(p => p.id_pedido === idPedido);
  if (!pedido) return;

  let partesCobradas = [];
  try {
    const params = new URLSearchParams({ accion: 'listar_pagos_divididos', id_pedido: idPedido });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true || !Array.isArray(data.partes)) {
      throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');
    }
    partesCobradas = data.partes;
  } catch (e) {
    alert('No se pudo cargar el progreso de este pedido (' + e.message + '). Intenta de nuevo antes de dividir la cuenta, para no arriesgar cobrar de más o de menos.');
    return;
  }

  const disponibles = pedido.items.map(it => ({
    producto: it.producto,
    precioUnitario: it.total / it.cantidad,
    cantidadLibre: it.cantidad
  }));

  partesCobradas.forEach(parte => {
    let detalle = [];
    try { detalle = JSON.parse(parte.detalle || '[]'); } catch (e) { detalle = []; }
    detalle.forEach(d => {
      const linea = disponibles.find(x => x.producto === d.producto);
      if (linea) linea.cantidadLibre = Math.max(0, linea.cantidadLibre - d.cantidad);
    });
  });

  division = {
    idPedido: idPedido,
    pedido: pedido,
    disponibles: disponibles,
    partesCobradas: partesCobradas,
    modo: 'item',
    cajaActual: { seleccion: {} },
    nPartesIguales: 2
  };

  document.getElementById('overlay-division').classList.remove('oculto');
  renderDivision();
}

let cobroParcialEnCurso = false;

function cerrarDivision() {
  if (cobroParcialEnCurso) {
    alert('Espera a que termine de procesarse el cobro actual antes de cerrar.');
    return;
  }
  division = null;
  document.getElementById('overlay-division').classList.add('oculto');
}

function liberarSeleccionActual() {
  if (!division) return;
  Object.keys(division.cajaActual.seleccion).forEach(producto => {
    const cant = division.cajaActual.seleccion[producto];
    if (cant > 0) {
      const linea = division.disponibles.find(x => x.producto === producto);
      if (linea) linea.cantidadLibre += cant;
    }
  });
  division.cajaActual = { seleccion: {} };
}

function cambiarModoDivision(modo) {
  if (!division) return;
  liberarSeleccionActual();
  division.modo = modo;
  renderDivision();
}

function ajustarUnidad(producto, delta) {
  const linea = division.disponibles.find(x => x.producto === producto);
  if (!linea) return;
  const actual = division.cajaActual.seleccion[producto] || 0;
  const nuevo = actual + delta;
  if (nuevo < 0 || nuevo > actual + linea.cantidadLibre) return;
  division.cajaActual.seleccion[producto] = nuevo;
  linea.cantidadLibre -= delta;
  renderDivision();
}

function subtotalCajaActual() {
  let subtotal = 0;
  Object.keys(division.cajaActual.seleccion).forEach(producto => {
    const cant = division.cajaActual.seleccion[producto];
    const linea = division.disponibles.find(x => x.producto === producto);
    if (linea && cant > 0) subtotal += cant * linea.precioUnitario;
  });
  return subtotal;
}

function iniciarCobroCajaItem() {
  const persona = document.getElementById('input-nombre-persona').value.trim();
  const subtotal = subtotalCajaActual();
  if (!persona) {
    alert('Escribe el nombre de la persona.');
    document.getElementById('input-nombre-persona').focus();
    return;
  }
  if (subtotal <= 0) { alert('Selecciona al menos un ítem para esta caja.'); return; }

  const detalle = Object.keys(division.cajaActual.seleccion)
    .filter(p => division.cajaActual.seleccion[p] > 0)
    .map(p => ({ producto: p, cantidad: division.cajaActual.seleccion[p] }));

  idPedidoParaCobrarParcial = division.idPedido;
  personaParaCobrarParcial = persona;
  montoParaCobrarParcial = Math.round(subtotal);
  detalleParaCobrarParcial = JSON.stringify(detalle);
  document.getElementById('overlay-cobrar-parcial').classList.remove('oculto');
}

function cerrarModalCobrarParcial() {
  document.getElementById('overlay-cobrar-parcial').classList.add('oculto');
}

async function confirmarCobroParcial(metodo) {
  cerrarModalCobrarParcial();
  const idPedido = idPedidoParaCobrarParcial;
  const persona = personaParaCobrarParcial;
  const monto = montoParaCobrarParcial;
  const detalle = detalleParaCobrarParcial;
  if (!idPedido || !persona || !monto) return;

  // Capturamos lo que necesitamos del pedido ANTES del await: "division" puede
  // volverse null (o apuntar a otro pedido) mientras esta petición está en
  // vuelo, si el cajero alcanza a cerrar la vista o abrir otra división.
  const pedidoTipo = division ? division.pedido.tipo : null;
  const pedidoMesa = division ? division.pedido.mesa : null;
  const disponiblesSnapshot = division ? division.disponibles.map(l => ({ producto: l.producto, precioUnitario: l.precioUnitario })) : [];

  cobroParcialEnCurso = true;
  try {
    const params = new URLSearchParams({
      accion: 'registrar_pago_parcial',
      id_pedido: idPedido,
      persona: persona,
      monto: monto,
      metodo_pago: metodo,
      detalle: detalle
    });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');

    let itemsDetalle = [];
    try { itemsDetalle = JSON.parse(detalle || '[]'); } catch (e) { itemsDetalle = []; }
    const itemsRecibo = itemsDetalle.map(d => {
      const linea = disponiblesSnapshot.find(x => x.producto === d.producto);
      const precioUnitario = linea ? linea.precioUnitario : (monto / d.cantidad);
      return { producto: d.producto, cantidad: d.cantidad, total: precioUnitario * d.cantidad };
    });

    imprimirRecibo({
      tipo: pedidoTipo,
      mesa: pedidoMesa,
      items: itemsRecibo,
      total: monto,
      metodo_pago: metodo + ' — ' + persona + (data.completado ? '' : ' · PAGO PARCIAL, falta ' + formatoCOP(data.restante))
    });

    if (division && division.idPedido === idPedido) {
      division.partesCobradas.push({ persona: persona, monto: monto, metodo_pago: metodo, detalle: detalle });
      division.cajaActual = { seleccion: {} };
      const inputNombre = document.getElementById('input-nombre-persona');
      if (inputNombre) inputNombre.value = '';
      if (!data.completado) renderDivision();
    }

    if (data.completado) {
      pedidosPagoPendiente.add(idPedido);
      if (division && division.idPedido === idPedido) {
        division = null;
        document.getElementById('overlay-division').classList.add('oculto');
      }
      await cargarPedidos();
      pedidosPagoPendiente.delete(idPedido);
    }
  } catch (e) {
    alert('No se pudo confirmar el cobro de esa parte (' + e.message + '). Abre "Dividir cuenta" de nuevo y revisa "Ya cobrado" antes de reintentar — puede que el pago sí se haya registrado.');
  } finally {
    cobroParcialEnCurso = false;
  }
}

function renderDivision() {
  if (!division) return;
  const totalPedido = division.pedido.total;
  const totalCobrado = division.partesCobradas.reduce((s, p) => s + Number(p.monto), 0);
  const restante = totalPedido - totalCobrado;

  const contPartes = document.getElementById('division-partes-cobradas');
  contPartes.innerHTML = division.partesCobradas.length === 0
    ? '<div style="font-size:0.8rem;color:rgba(201,184,154,0.5);">Nadie ha pagado todavía.</div>'
    : division.partesCobradas.map(p => `
        <div class="parte-cobrada">
          <span>✅ ${p.persona}</span>
          <span>${formatoCOP(p.monto)} (${p.metodo_pago})</span>
        </div>
      `).join('');

  document.getElementById('division-restante').textContent = 'Falta por cobrar: ' + formatoCOP(restante);

  document.getElementById('btn-modo-item').classList.toggle('activo', division.modo === 'item');
  document.getElementById('btn-modo-igual').classList.toggle('activo', division.modo === 'igual');
  document.getElementById('division-modo-item').style.display = division.modo === 'item' ? 'flex' : 'none';
  document.getElementById('division-modo-igual').style.display = division.modo === 'igual' ? 'flex' : 'none';

  if (division.modo === 'item') {
    const contProductos = document.getElementById('division-productos');
    contProductos.innerHTML = division.disponibles.map(linea => `
      <div class="producto-stepper">
        <div class="info">
          <span>${linea.producto}</span>
          <span class="disponible">${linea.cantidadLibre} sin asignar</span>
        </div>
        <div class="stepper-controles">
          <button class="btn-stepper" onclick="ajustarUnidad('${linea.producto}', -1)">−</button>
          <span>${division.cajaActual.seleccion[linea.producto] || 0}</span>
          <button class="btn-stepper" onclick="ajustarUnidad('${linea.producto}', 1)" ${linea.cantidadLibre <= 0 ? 'disabled' : ''}>+</button>
        </div>
      </div>
    `).join('');
    document.getElementById('division-subtotal-caja').textContent = formatoCOP(subtotalCajaActual());
  } else {
    renderPartesIguales();
  }
}

function generarPartesIguales() {
  const n = parseInt(document.getElementById('input-n-partes').value, 10);
  if (!n || n < 2) { alert('Escribe un número de personas de 2 o más.'); return; }
  division.nPartesIguales = n;
  renderPartesIguales();
}

function renderPartesIguales() {
  const totalPedido = division.pedido.total;
  const totalCobrado = division.partesCobradas.reduce((s, p) => s + Number(p.monto), 0);
  const restante = totalPedido - totalCobrado;
  const n = division.nPartesIguales;
  const yaGeneradas = division.partesCobradas.length;
  const partesFaltantes = Math.max(0, n - yaGeneradas);

  const cont = document.getElementById('division-partes-iguales-lista');
  if (partesFaltantes === 0) {
    cont.innerHTML = '<div style="font-size:0.8rem;color:rgba(201,184,154,0.5);">Ya se generaron todas las partes para este número de personas.</div>';
    return;
  }

  const base = Math.floor(restante / partesFaltantes);
  const html = [];
  for (let i = 0; i < partesFaltantes; i++) {
    const esUltima = i === partesFaltantes - 1;
    const monto = esUltima ? (restante - base * (partesFaltantes - 1)) : base;
    const numeroParte = yaGeneradas + i + 1;
    html.push(`
      <div class="parte-igual-card">
        <span>Parte ${numeroParte} de ${n}</span>
        <span>${formatoCOP(monto)}</span>
        <button class="btn-cobrar" onclick="cobrarParteIgual(${numeroParte}, ${monto})">Cobrar</button>
      </div>
    `);
  }
  cont.innerHTML = html.join('');
}

function cobrarParteIgual(numeroParte, monto) {
  if (!monto || monto <= 0) { alert('Esta parte quedó en $0 — ajusta el número de personas.'); return; }
  idPedidoParaCobrarParcial = division.idPedido;
  personaParaCobrarParcial = 'Parte ' + numeroParte + ' de ' + division.nPartesIguales;
  montoParaCobrarParcial = monto;
  detalleParaCobrarParcial = '';
  document.getElementById('overlay-cobrar-parcial').classList.remove('oculto');
}

function formatoCOP(v) { return '$' + Math.round(v).toLocaleString('es-CO'); }

// Venta Rápida: cliente de mostrador sin mesa ni mesero. El carrito vive solo en
// memoria (a diferencia de menu.html, que lo guarda en localStorage) porque este
// es un dispositivo compartido de caja, no el teléfono de un cliente.
let productosVentaRapida = [];
let productosVentaRapidaError = false;
let categoriaActivaVR = null;
let carritoVentaRapida = [];
let entregaInmediataVR = true; // true = "Cobrar y entregar", false = "Cobrar y dejar para recoger"
let nombreVentaRapida = '';
let idPedidoVentaRapida = null; // id_pedido ya creado (Pendiente de pago), esperando método de pago
let itemsVentaRapidaSnapshot = []; // Snapshot del carrito capturado cuando crear_pedido tuvo éxito
let cobroVentaRapidaEnCurso = false; // Guard contra double-tap en iniciarCobroVentaRapida

  document.getElementById('vr-tamano-valor').textContent = valor + '%';
  try { localStorage.setItem('degCajaVRTamano', valor); } catch (e) {}
}

function abrirVentaRapida() {

  // para no servir precios obsoletos si el dueño los edita desde menu.html
  // mientras la tablet de caja se queda abierta todo el turno.

  document.getElementById('vr-tamano-slider').value = tamanoGuardado;
  cambiarTamanoVR(tamanoGuardado);

function abrirCarritoPanelVR() {

}
function cerrarCarritoPanelVR() {

}

function cerrarVentaRapida() {
  document.getElementById('overlay-vr').classList.add('oculto');
  document.getElementById('overlay-vr-carrito').classList.add('oculto');
  document.getElementById('vr-carrito-flotante').classList.add('oculto');
  carritoVentaRapida = [];
  itemsVentaRapidaSnapshot = [];

}

async function cargarProductosVentaRapida() {
  try {
    const res = await fetch(SCRIPT_URL + '?accion=listar_productos');
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.productos) || data.productos.length === 0) throw new Error('respuesta vacía');
    productosVentaRapida = data.productos;
    productosVentaRapidaError = false;
    categoriaActivaVR = productosVentaRapida[0].categoria;
    renderCategoriasVR();
    renderProductosVR();
  } catch (e) {
    productosVentaRapidaError = true;
    // Finding 3: si ya había un catálogo cargado de una petición anterior exitosa,
    // un refetch fallido (hipo de red) no debe borrar la lista que ya funciona --
    // la dejamos tal cual y solo mostramos el banner de error cuando no hay nada.
    if (productosVentaRapida.length === 0) {
      document.getElementById('vr-productos').innerHTML = '<div class="vr-vacio">⚠️ No se pudo cargar el catálogo. <button class="btn-cancelar" style="border:1px solid rgba(202,161,83,0.35);display:inline;" onclick="cargarProductosVentaRapida()">Reintentar</button></div>';
    }
  }
}

// Mismo mapa tonal que menu.html (COLORES_CATEGORIA) para que las categorías se
// vean iguales en Venta Rápida y en el menú del cliente.
const COLORES_CATEGORIA_VR = {
  'Platos':       { bg: '#a9642f', border: '#c8813f' },
  'Picadas':      { bg: '#8a2a48', border: '#a94263' },
  'Hamburguesas': { bg: '#caa153', border: '#e6c07a' },
  'Pizzas':       { bg: '#7a5323', border: '#96703c' },
  'Perros':       { bg: '#8a5a2b', border: '#a97142' },
  'Papas':        { bg: '#6b1530', border: '#8a2a48' },
  'Especiales':   { bg: '#5c3a1e', border: '#7a5323' },
  'Adicionales':  { bg: '#6b4a2a', border: '#87613a' },
  'Bebidas':      { bg: '#4a3319', border: '#6b4a2a' }
};

function renderCategoriasVR() {
  const categorias = [...new Set(productosVentaRapida.map(p => p.categoria))];
  const cont = document.getElementById('vr-categorias');
  const scrollActual = cont.scrollLeft;
  cont.innerHTML = categorias.map(c => {
    const col = COLORES_CATEGORIA_VR[c] || { bg: '#caa153', border: '#e6c07a' };
    const activa = c === categoriaActivaVR;
    const texto = (col.bg === '#caa153') ? '#1a0f07' : '#f3e6d0';
    return `<div class="vr-cat-pill${activa ? ' activa' : ''}" style="background:${col.bg};border-color:${col.border};color:${texto};" onclick="seleccionarCategoriaVR('${c.replace(/'/g, "\\'")}')">${c}</div>`;
  }).join('');
  cont.scrollLeft = scrollActual;
}

function seleccionarCategoriaVR(cat) {
  categoriaActivaVR = cat;
  renderCategoriasVR();
  renderProductosVR();
}

function renderProductosVR() {
  const lista = productosVentaRapida.filter(p => p.categoria === categoriaActivaVR);
  const filas = lista.map(p => {
    const idx = productosVentaRapida.indexOf(p);
    return `<div class="vr-producto-row">
      <span class="vr-producto-nombre">${p.producto}</span>
      <div class="vr-producto-accion">
        <span class="vr-producto-precio">${formatoCOP(p.precio)}</span>
        <button class="btn-stepper" onclick="agregarAlCarritoVR(${idx})">+</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('vr-productos').innerHTML = `<div class="vr-productos-lista">${filas}</div>`;
}

function agregarAlCarritoVR(idx) {
  const p = productosVentaRapida[idx];
  const existente = carritoVentaRapida.find(i => i.producto === p.producto && i.categoria === p.categoria);
  if (existente) { existente.cantidad++; }
  else { carritoVentaRapida.push({ producto: p.producto, categoria: p.categoria, precio: p.precio, cantidad: 1 }); }
  renderCarritoVR();
}

function cambiarCantidadVR(i, delta) {
  carritoVentaRapida[i].cantidad += delta;
  if (carritoVentaRapida[i].cantidad <= 0) carritoVentaRapida.splice(i, 1);
  renderCarritoVR();
}

function renderCarritoVR() {
  const cont = document.getElementById('vr-carrito');
  cont.innerHTML = carritoVentaRapida.length === 0
    ? '<div class="vr-vacio">Carrito vacío</div>'
    : carritoVentaRapida.map((item, i) => `
      <div class="vr-carrito-item">
        <span>${item.cantidad}x ${item.producto}</span>
        <div class="stepper-controles">
          <button class="btn-stepper" onclick="cambiarCantidadVR(${i}, -1)">−</button>
          <span>${formatoCOP(item.precio * item.cantidad)}</span>
        </div>
      </div>
    `).join('');
  const totalItems = carritoVentaRapida.reduce((s, i) => s + i.cantidad, 0);
  const total = carritoVentaRapida.reduce((s, i) => s + i.cantidad * i.precio, 0);
  document.getElementById('vr-total').textContent = formatoCOP(total);

  const flot = document.getElementById('vr-carrito-flotante');
  if (totalItems === 0) {
    flot.classList.add('oculto');
    cerrarCarritoPanelVR();
  } else {
    flot.classList.remove('oculto');
  }
  document.getElementById('vr-flotante-badge').textContent = totalItems;
  document.getElementById('vr-flotante-total').textContent = formatoCOP(total);
}

async function iniciarCobroVentaRapida(entregarYa) {
  // Finding 2: Guard contra double-tap -- si ya hay una llamada en vuelo, ignora esta.
  if (cobroVentaRapidaEnCurso) return;

  if (carritoVentaRapida.length === 0) { alert('Agrega al menos un producto al carrito.'); return; }

  let nombre = '';
  if (!entregarYa) {
    const respuesta = prompt('Nombre del cliente para recoger su pedido:');
    if (respuesta === null) return; // canceló el diálogo -- sin aviso, fue una acción clara
    nombre = respuesta.trim();
    if (!nombre) {
      alert('Escribe el nombre del cliente para dejar el pedido pendiente de recoger.');
      return;
    }
  }

  entregaInmediataVR = entregarYa;
  nombreVentaRapida = nombre;
  const total = carritoVentaRapida.reduce((s, i) => s + i.cantidad * i.precio, 0);

  cobroVentaRapidaEnCurso = true;
  try {
    const params = new URLSearchParams({
      accion: 'crear_pedido',
      items: JSON.stringify(carritoVentaRapida),
      total: String(total),
      tipo: 'mostrador',
      mesa: nombre,
      mesero: ''
    });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');
    // Finding 1: Capturamos snapshot del carrito en este momento exacto,
    // cuando crear_pedido tuvo éxito. Si el cajero edita el carrito después,
    // la factura usará este snapshot, no el carrito en vivo.
    itemsVentaRapidaSnapshot = carritoVentaRapida.map(i => ({...i}));
    idPedidoVentaRapida = data.id_pedido;
    document.getElementById('overlay-cobrar-vr').classList.remove('oculto');
  } catch (e) {
    alert('No se pudo registrar el pedido (' + e.message + '). El carrito no se perdió -- intenta de nuevo.');
  } finally {
    cobroVentaRapidaEnCurso = false;
  }
}

function cerrarModalCobrarVR() {
  document.getElementById('overlay-cobrar-vr').classList.add('oculto');
  idPedidoVentaRapida = null;
  itemsVentaRapidaSnapshot = [];
}

async function confirmarCobroVentaRapida(metodo) {
  const idPedido = idPedidoVentaRapida;
  const entregar = entregaInmediataVR;
  const nombre = nombreVentaRapida;
  // Finding 1: Construir la factura del snapshot congelado cuando crear_pedido tuvo éxito,
  // NO del carrito en vivo, que puede haber sido editado mientras la petición estaba en vuelo.
  const snapshot = itemsVentaRapidaSnapshot;
  const itemsRecibo = snapshot.map(i => ({ producto: i.producto, cantidad: i.cantidad, total: i.precio * i.cantidad }));
  const total = itemsRecibo.reduce((s, i) => s + i.total, 0);
  document.getElementById('overlay-cobrar-vr').classList.add('oculto');
  idPedidoVentaRapida = null;
  itemsVentaRapidaSnapshot = [];
  if (!idPedido) return;

  // Mismo mecanismo que confirmarCobro/liberarPedidoDomicilio/marcarMostradorRecogido
  // (ver aplicarPendientes): protege contra el polling automático de 12s pisando
  // este cobro con un estado obsoleto si una respuesta llega mientras la petición
  // sigue en vuelo (hallazgo 2 de la revisión final).
  pedidosPagoPendiente.add(idPedido);
  if (entregar) pedidosLiberacionPendiente.add(idPedido);

  try {
    const params = new URLSearchParams({ accion: 'marcar_pedido_pagado', id_pedido: idPedido, metodo_pago: metodo });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');

    if (entregar) {
      // Si el cobro ya quedó registrado pero esta llamada falla, el pedido queda
      // Pagado tipo mostrador y aparece en "Para recoger" en vez de perderse --
      // se puede marcar recogido manualmente desde ahí (Task 2), no es bloqueante.
      const paramsLib = new URLSearchParams({ accion: 'liberar_pedido', id_pedido: idPedido });
      await fetch(SCRIPT_URL + '?' + paramsLib.toString());
    }

    imprimirRecibo({ tipo: 'mostrador', mesa: nombre, items: itemsRecibo, total: total, metodo_pago: metodo });
    carritoVentaRapida = [];
    cerrarVentaRapida();
    await cargarPedidos();
  } catch (e) {
    alert('No se pudo confirmar el cobro (' + e.message + '). El pedido queda pendiente de pago -- lo puedes cobrar desde el Historial (pestaña Mostrador).');
  } finally {
    pedidosPagoPendiente.delete(idPedido);
    pedidosLiberacionPendiente.delete(idPedido);
  }
}

async function cargarPedidos() {
  try {
    const res = await fetch(SCRIPT_URL + '?accion=listar_pedidos_caja');
    const data = await res.json();
    if (data.ok && Array.isArray(data.pedidos)) {
      pedidos = data.pedidos;
      usandoDatosMuestra = false;
    } else {
      pedidos = pedidosMock();
      usandoDatosMuestra = true;
    }
  } catch (e) {
    pedidos = pedidosMock();
    usandoDatosMuestra = true;
  }
  aplicarPendientes(pedidos);
  actualizarCuposDomicilio();
  renderPrincipal();
  if (mesaAbierta !== null) renderDetalleMesa();
  if (domicilioAbierto !== null) renderDetalleDomicilio();
  if (mostradorAbierto !== null) renderDetalleMostrador();
}

// Cambios optimistas todavía no confirmados por el servidor. Sin esto, el
// polling automático (cada INTERVALO_POLLING_MS) podría pisar un cobro recién
// hecho si llega antes de que termine de guardarse en el Sheet — mismo
// patrón ya usado en cocina.html (ver ESTADO.md, hallazgo 2026-07-22).
function aplicarPendientes(lista) {
  lista.forEach(p => {
    if (pedidosPagoPendiente.has(p.id_pedido)) p.estado = 'Pagado';
    else if (pedidosLiberacionPendiente.has(p.id_pedido)) p.estado = 'Liberado';
  });
}

function abrirDetalleMesa(numMesa) {
  const rondas = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(numMesa) && p.estado !== 'Liberado');
  if (rondas.length === 0) return; // mesa libre, no hace nada

  domicilioAbierto = null;
  mostradorAbierto = null;
  mesaAbierta = numMesa;
  renderDetalleMesa();
  document.getElementById('overlay-detalle').classList.remove('oculto');
}

function renderDetalleMesa() {
  const rondas = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(mesaAbierta) && p.estado !== 'Liberado')
    .sort((a, b) => a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0);
  if (rondas.length === 0) { cerrarDetalle(); return; }

  const pendientes = rondas.filter(p => p.estado === 'Pendiente de pago');
  const totalPendiente = pendientes.reduce((s, p) => s + p.total, 0);
  const meseroRonda = rondas.find(p => p.mesero);
  const mesero = meseroRonda ? meseroRonda.mesero : '';

  const rondasHtml = rondas.map(r => `
    <div class="ronda-bloque">
      <div class="ronda-header">
        <span>${r.hora}</span>
        <span class="badge-estado ${r.estado === 'Pendiente de pago' ? 'pendiente' : 'pagado'}">${r.estado === 'Pendiente de pago' ? '⏳ Pendiente' : '✅ Pagado'}</span>
      </div>
      ${r.items.map(it => `<div class="item-row"><span>${it.cantidad}x ${it.producto}</span><span>${formatoCOP(it.total)}</span></div>`).join('')}
      ${r.estado === 'Pendiente de pago' ? `<div style="display:flex;justify-content:flex-end;margin-top:6px;"><button class="btn-cancelar" style="border:1px solid rgba(202,161,83,0.35);padding:8px 12px;font-size:0.78rem;" onclick="abrirDivision('${r.id_pedido}')">➗ Dividir cuenta</button></div>` : ''}
    </div>
  `).join('');

  document.getElementById('detalle-contenido').innerHTML = `
    <h3>🍽️ Mesa ${mesaAbierta}${mesero ? ' — 👤 ' + mesero : ''}</h3>
    ${rondasHtml}
    <div class="pedido-total-row"><span>TOTAL PENDIENTE</span><span>${formatoCOP(totalPendiente)}</span></div>
    <div class="pedido-footer" style="flex-wrap:wrap;gap:8px;">
      ${pendientes.length > 0 ? `<button class="btn-cobrar" onclick="abrirModalCobrarMesa(${mesaAbierta})">Cobrar ${formatoCOP(totalPendiente)}</button>` : ''}
      ${pendientes.length === 0 ? `<button class="btn-cancelar" style="border:1px solid rgba(202,161,83,0.35);" onclick="reimprimirReciboMesa(${mesaAbierta})">🖨️ Reimprimir recibo</button>` : ''}
      ${pendientes.length === 0 ? `<button class="btn-liberar" onclick="liberarMesa(${mesaAbierta})">🚪 Liberar mesa</button>` : ''}
    </div>
    <button class="btn-cancelar" onclick="cerrarDetalle()">Cerrar</button>
  `;
}

// A diferencia de imprimirReciboPorId (que reimprime un solo id_pedido), esto
// combina TODAS las rondas ya pagadas de la mesa en un solo recibo -- si hubo
// más de una ronda y se cobraron por separado, un solo id_pedido dejaría por
// fuera las demás. Si los métodos de pago de cada ronda fueron distintos, se
// muestra "Varios" en vez de elegir uno arbitrariamente.
function reimprimirReciboMesa(numMesa) {
  const rondas = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(numMesa) && p.estado === 'Pagado');
  if (rondas.length === 0) return;
  const items = [];
  rondas.forEach(r => r.items.forEach(it => items.push(it)));
  const total = rondas.reduce((s, r) => s + r.total, 0);
  const metodos = [...new Set(rondas.map(r => r.metodo_pago))];
  const metodoTexto = metodos.length === 1 ? metodos[0] : 'Varios';
  imprimirRecibo({ tipo: 'local', mesa: numMesa, items: items, total: total, metodo_pago: metodoTexto });
}

async function liberarMesa(numMesa) {
  if (!confirm('¿Liberar la mesa ' + numMesa + '? Ya no se verá como ocupada.')) return;
  const activos = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(numMesa) && p.estado !== 'Liberado');
  if (activos.length === 0) return;

  const idsAfectados = activos.map(p => p.id_pedido);
  idsAfectados.forEach(id => pedidosLiberacionPendiente.add(id));
  const estadosAnteriores = activos.map(p => p.estado);
  activos.forEach(p => { p.estado = 'Liberado'; });
  renderPrincipal();
  cerrarDetalle();

  try {
    const params = new URLSearchParams({ accion: 'liberar_mesa', mesa: String(numMesa) });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');
  } catch (e) {
    activos.forEach((p, i) => { p.estado = estadosAnteriores[i]; });
    renderPrincipal();
    alert('No se pudo liberar la mesa: ' + e.message);
  } finally {
    idsAfectados.forEach(id => pedidosLiberacionPendiente.delete(id));
  }
}

  }

  pedidoIdParaCobrar = idPedido;

async function abrirModalCobrarMesa(numMesa) {
  const pendientes = pedidos.filter(p => p.tipo === 'local' && String(p.mesa) === String(numMesa) && p.estado === 'Pendiente de pago');
  for (const p of pendientes) {
    try {
      const params = new URLSearchParams({ accion: 'listar_pagos_divididos', id_pedido: p.id_pedido });
      const res = await fetch(SCRIPT_URL + '?' + params.toString());
      const data = await res.json();
      if (data.ok && Array.isArray(data.partes) && data.partes.length > 0) {
        alert('Una de las rondas de esta mesa ya tiene pagos parciales registrados. Usa "Dividir cuenta" para terminar de cobrarla antes de cobrar el resto de la mesa.');
        return;
      }
    } catch (e) {
      // Si no se puede verificar (sin conexión), se deja continuar para esa ronda.
    }
  }
  cobroModo = 'mesa';
  mesaParaCobrar = numMesa;
  idsParaCobrarMesa = pendientes.map(p => p.id_pedido);
  document.getElementById('overlay-cobrar').classList.remove('oculto');
}

function cerrarModalCobrar() {
  pedidoIdParaCobrar = null;
  cobroModo = 'individual';
  mesaParaCobrar = null;
  idsParaCobrarMesa = [];
  document.getElementById('overlay-cobrar').classList.add('oculto');
}

async function confirmarCobro(metodo) {
  // Capturamos todo lo que hace falta ANTES de cerrarModalCobrar(): esa función
  // ahora resetea cobroModo/mesaParaCobrar/idsParaCobrarMesa (hallazgo 3 de la
  // revisión final), así que si los leyéramos después ya estarían en blanco.
  const idPedido = pedidoIdParaCobrar;
  const modo = cobroModo;
  const numMesaCobrar = mesaParaCobrar;
  const idsCobrar = idsParaCobrarMesa.slice();
  cerrarModalCobrar();
  if (modo === 'mesa') { await confirmarCobroMesa(numMesaCobrar, idsCobrar, metodo); return; }

  if (!idPedido) return;

  pedidosPagoPendiente.add(idPedido);
  const pedido = pedidos.find(p => p.id_pedido === idPedido);
  const estadoAnterior = pedido ? pedido.estado : null;
  const metodoPagoAnterior = pedido ? pedido.metodo_pago : '';
  if (pedido) { pedido.estado = 'Pagado'; pedido.metodo_pago = metodo; }
  renderPrincipal();

  try {
    const params = new URLSearchParams({ accion: 'marcar_pedido_pagado', id_pedido: idPedido, metodo_pago: metodo });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'Respuesta inválida del servidor');
    if (pedido && pedido.tipo === 'local') imprimirRecibo(pedido);
  } catch (e) {
    // El backend rechazó el cobro, no respondió con el formato esperado
    // (p. ej. página HTML de login de Google) o falló la red: revertimos el
    // cambio optimista para no dejar "Pagado" en pantalla sin que el Sheet
    // se haya actualizado de verdad.
    if (pedido) { pedido.estado = estadoAnterior; pedido.metodo_pago = metodoPagoAnterior; }
    renderPrincipal();
    alert('No se pudo registrar el cobro. Intenta de nuevo.');
  } finally {
    pedidosPagoPendiente.delete(idPedido);
  }
}

async function confirmarCobroMesa(numMesa, idsCobrar, metodo) {
  if (!numMesa) return;
  // Cobrar exactamente los ids verificados y mostrados al abrir el modal
  // (capturados por confirmarCobro en idsCobrar, a partir de idsParaCobrarMesa),
  // no una relectura fresca de "pendientes" en vivo -- si una nueva ronda llegó
  // por polling mientras el modal estaba abierto, nunca pasó por la
  // verificación de listar_pagos_divididos ni la vio el cajero, así que no se
  // cobra automáticamente con ella (hallazgo 2 de la revisión final). Se
  // filtra a las que sigan Pendiente de pago por si alguna se resolvió de
  // otra forma mientras tanto.
  const pendientes = idsCobrar
    .map(id => pedidos.find(p => p.id_pedido === id))
    .filter(p => p && p.estado === 'Pendiente de pago');
  if (pendientes.length === 0) return;

  const idsAfectados = pendientes.map(p => p.id_pedido);
  idsAfectados.forEach(id => pedidosPagoPendiente.add(id));
  const estadosAnteriores = pendientes.map(p => ({ id: p.id_pedido, estado: p.estado, metodo: p.metodo_pago }));
  pendientes.forEach(p => { p.estado = 'Pagado'; p.metodo_pago = metodo; });
  renderPrincipal();
  if (mesaAbierta === numMesa) renderDetalleMesa();

  try {
    const resultados = await Promise.all(idsAfectados.map(id => {
      const params = new URLSearchParams({ accion: 'marcar_pedido_pagado', id_pedido: id, metodo_pago: metodo });
      return fetch(SCRIPT_URL + '?' + params.toString()).then(r => r.json());
    }));
    if (resultados.some(d => !d || d.ok !== true)) throw new Error('El servidor rechazó al menos uno de los cobros de esta mesa');

    const itemsCombinados = [];
    pendientes.forEach(p => p.items.forEach(it => itemsCombinados.push(it)));
    const totalCombinado = pendientes.reduce((s, p) => s + p.total, 0);
    imprimirRecibo({ tipo: 'local', mesa: numMesa, items: itemsCombinados, total: totalCombinado, metodo_pago: metodo });
  } catch (e) {
    estadosAnteriores.forEach(prev => {
      const p = pedidos.find(x => x.id_pedido === prev.id);
      if (p) { p.estado = prev.estado; p.metodo_pago = prev.metodo; }
    });
    renderPrincipal();
    if (mesaAbierta === numMesa) renderDetalleMesa();
    alert('No se pudo registrar el cobro de la mesa. Intenta de nuevo.');
  } finally {
    idsAfectados.forEach(id => pedidosPagoPendiente.delete(id));
  }
}

function cambiarVistaTipo(t) {
  vistaTipo = t;
  renderPrincipal();
}

function cambiarVistaEstado(v) {
  vistaEstado = v;
  renderPrincipal();
}

function renderPrincipal() {
  if (vistaPrincipal === 'grid') renderGrid(); else renderHistorial();
}

function cambiarVistaPrincipal(v) {
  vistaPrincipal = v;
  document.getElementById('btn-vista-historial').textContent = v === 'grid' ? '🕒 Historial de hoy' : '🏠 Mesas';
  renderPrincipal();
}

function renderGrid() {
  const cont = document.getElementById('lista-pedidos');
  const banner = usandoDatosMuestra
    ? '<div class="banner-mock">⚠️ SIN CONEXIÓN — mostrando datos de muestra, no se puede cobrar de verdad</div>'
    : '';

  const mesasHtml = [];
  for (let n = 1; n <= 20; n++) {
    const estado = estadoMesaColor(n);
    mesasHtml.push(`<button class="btn-mesa estado-${estado}" onclick="abrirDetalleMesa(${n})">MESA<span class="btn-mesa-num">${n}</span></button>`);
  }

  const activosDom = pedidos.filter(p => p.tipo === 'domicilio' && p.estado !== 'Liberado');
  const cuposHtml = [];
  for (let slot = 1; slot <= 5; slot++) {
    const idConEseCupo = Object.keys(domicilioCupos).find(id => domicilioCupos[id] === slot);
    const pedido = idConEseCupo ? activosDom.find(p => p.id_pedido === idConEseCupo) : null;
    const estado = !pedido ? 'libre' : (pedido.estado === 'Pendiente de pago' ? 'ocupada-pendiente' : 'ocupada-pagada');
    const onclick = pedido ? `onclick="abrirDetalleDomicilio('${pedido.id_pedido}')"` : '';
    cuposHtml.push(`<button class="btn-domicilio estado-dom-${estado}" ${onclick} ${pedido ? '' : 'disabled'}>DOMIC.<span class="btn-mesa-num">${slot}</span></button>`);
  }

  const enEspera = activosDom.filter(p => !domicilioCupos[p.id_pedido]);
  const esperaHtml = enEspera.length === 0 ? '' : `
    <div class="franja-espera">
      <div class="franja-espera-titulo">En espera de cupo (${enEspera.length})</div>
      ${enEspera.map(p => `<button class="btn-espera" onclick="abrirDetalleDomicilio('${p.id_pedido}')">${p.hora}</button>`).join('')}
    </div>`;

  const activosMostrador = pedidos.filter(p => p.tipo === 'mostrador' && p.estado === 'Pagado')
    .sort((a, b) => a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0);
  const recogerHtml = activosMostrador.length === 0 ? '' : `
    <div class="linea-divisoria"></div>
    <div class="seccion-recoger">
      <div class="franja-espera-titulo">Para recoger (${activosMostrador.length})</div>
      ${activosMostrador.map(p => `<button class="btn-recoger" onclick="abrirDetalleMostrador('${p.id_pedido}')"><span>${p.mesa || 'Sin nombre'}</span><span>${p.hora}</span><span>${formatoCOP(p.total)}</span></button>`).join('')}
    </div>`;

  cont.innerHTML = banner + `
    <div class="pantalla-grid">
      <div class="grid-titulo">🍽️ Gestión de Mesas</div>
      <div class="grid-mesas">${mesasHtml.join('')}</div>
      <div class="linea-divisoria"></div>
      <div class="grid-domicilios">${cuposHtml.join('')}</div>
      ${esperaHtml}
      ${recogerHtml}
    </div>`;
}

function renderHistorial() {
  const cont = document.getElementById('lista-pedidos');
  const banner = usandoDatosMuestra
    ? '<div class="banner-mock">⚠️ SIN CONEXIÓN — mostrando datos de muestra, no se puede cobrar de verdad</div>'
    : '';

  const filtrosHtml = `
    <div class="historial-filtros">
      <div class="grupo-tabs">
        <button class="btn-tab ${vistaTipo === 'local' ? 'activa' : ''}" onclick="cambiarVistaTipo('local')">En el local</button>
        <button class="btn-tab ${vistaTipo === 'domicilio' ? 'activa' : ''}" onclick="cambiarVistaTipo('domicilio')">Domicilio</button>
        <button class="btn-tab ${vistaTipo === 'mostrador' ? 'activa' : ''}" onclick="cambiarVistaTipo('mostrador')">Mostrador</button>
      </div>
      <div class="grupo-tabs">
        <button class="btn-tab ${vistaEstado === 'pendientes' ? 'activa' : ''}" onclick="cambiarVistaEstado('pendientes')">Pendientes</button>
        <button class="btn-tab ${vistaEstado === 'pagados' ? 'activa' : ''}" onclick="cambiarVistaEstado('pagados')">Pagados</button>
      </div>
    </div>`;

  const lista = pedidos.filter(p =>
    p.tipo === vistaTipo &&
    (vistaEstado === 'pendientes' ? p.estado === 'Pendiente de pago' : (p.estado === 'Pagado' || p.estado === 'Liberado'))
  );

  if (lista.length === 0) {
    const etiquetaVacio = vistaTipo === 'local' ? 'el local' : (vistaTipo === 'domicilio' ? 'domicilio' : 'mostrador');
    cont.innerHTML = banner + filtrosHtml + `<div class="vacio-msg">No hay pedidos ${vistaEstado === 'pendientes' ? 'pendientes de pago' : 'pagados'} en ${etiquetaVacio} hoy.</div>`;
    return;
  }

  cont.innerHTML = banner + filtrosHtml + lista.map(p => `
    <div class="pedido-card">
      <div class="pedido-header">
        <div>
          <div class="pedido-titulo">${p.tipo === 'local' ? '🍽️ Mesa ' + (p.mesa || '—') : (p.tipo === 'mostrador' ? '🧾 ' + (p.mesa || 'Mostrador') : '🛵 Domicilio')}</div>
          <div class="pedido-sub">${p.mesero ? '👤 ' + p.mesero : ''}</div>
          <div class="badge-estado ${p.estado === 'Pendiente de pago' ? 'pendiente' : 'pagado'}">${p.estado === 'Pendiente de pago' ? '⏳ Pendiente de pago' : (p.estado === 'Liberado' ? '✅ Pagado (liberado)' : '✅ Pagado (' + p.metodo_pago + ')')}</div>
        </div>
        <div class="pedido-hora">${p.hora}</div>
      </div>
      ${p.items.map(it => `
        <div class="item-row">
          <span>${it.cantidad}x ${it.producto}</span>
          <span>${formatoCOP(it.total)}</span>
        </div>
      `).join('')}
      <div class="pedido-total-row">
        <span>TOTAL</span>
        <span>${formatoCOP(p.total)}</span>
      </div>
      <div class="pedido-footer">
        ${p.estado === 'Pendiente de pago' ? `<button class="btn-cobrar" onclick="abrirModalCobrar('${p.id_pedido}')">Cobrar</button>` : ''}
        <button class="btn-cancelar" style="border:1px solid rgba(202,161,83,0.35);" onclick="imprimirReciboPorId('${p.id_pedido}')">🖨️ ${p.estado === 'Pendiente de pago' ? 'Imprimir' : 'Reimprimir'} recibo</button>
      </div>
    </div>
  `).join('');
}

cargarCuposDomicilio();
setInterval(() => cargarPedidos(), INTERVALO_POLLING_MS);
cargarPedidos();
</script>
