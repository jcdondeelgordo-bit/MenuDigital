<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Donde el Gordo - Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#241407 0%,#170d06 55%,#120a04 100%);color:#f3e6d0;min-height:100vh;padding-bottom:90px;}

header{position:sticky;top:0;z-index:20;background:#170d06;border-bottom:1px solid rgba(202,161,83,0.3);padding:14px 16px 0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.header-titulo{font-family:'Poppins',sans-serif;font-size:1.15rem;font-weight:800;color:#caa153;letter-spacing:1px;}
.header-sub{font-size:0.72rem;color:#e6d3ac;letter-spacing:2px;}
.btn-admin{background:transparent;border:none;color:rgba(255,255,255,0.25);font-size:1.1rem;cursor:pointer;padding:4px 8px;}
.btn-admin:hover{color:rgba(255,255,255,0.5);}

.categorias{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
.categorias::-webkit-scrollbar{display:none;}
.cat-pill{flex:none;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.3);color:#f3e6d0;font-size:0.85rem;white-space:nowrap;cursor:pointer;transition:all 0.2s;}
.cat-pill.activa{font-weight:700;box-shadow:0 0 14px rgba(202,161,83,0.35);}

.mesa-badge{display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(202,161,83,0.15);border:1px solid rgba(202,161,83,0.4);color:#e0a53f;font-size:0.78rem;font-weight:700;margin-bottom:10px;}
.mesa-nota{font-size:0.78rem;color:rgba(201,184,154,0.7);margin-top:6px;line-height:1.4;}

main{padding:16px;max-width:640px;margin:0 auto;}

.seccion-titulo{font-family:'Poppins',sans-serif;font-size:1.05rem;color:#caa153;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
#seccion-recomendados{display:none;}

.producto-card{display:flex;gap:12px;border:1px solid rgba(202,161,83,0.14);border-radius:0;padding:12px;margin:0;align-items:center;}
#lista-productos,#lista-recomendados{border-radius:14px;overflow:hidden;border:1px solid rgba(202,161,83,0.2);}
.producto-card:nth-child(odd){background:rgba(255,255,255,0.045);}
.producto-card:nth-child(even){background:rgba(0,0,0,0.16);}
.producto-media{flex:none;width:68px;height:68px;border-radius:50%;background:rgba(202,161,83,0.15);border:2px solid rgba(202,161,83,0.35);box-shadow:0 4px 14px rgba(0,0,0,0.4);overflow:hidden;position:relative;transition:border-color 0.2s;}
.producto-media img{width:100%;height:100%;object-fit:cover;display:block;}
.producto-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;}
.producto-info{flex:1;min-width:0;}
.producto-nombre{font-weight:700;font-size:0.97rem;color:#fff;}
.producto-desc{font-size:0.78rem;color:rgba(201,184,154,0.7);line-height:1.35;margin-top:2px;}
.producto-precio-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.producto-precio{font-weight:700;color:#e0a53f;font-size:0.92rem;}
.precio-edit-btn{background:transparent;border:none;color:rgba(255,255,255,0.3);font-size:0.85rem;cursor:pointer;display:none;}
.admin-on .precio-edit-btn{display:inline-block;}
.btn-agregar{flex:none;width:34px;height:34px;border-radius:50%;background:#e0a53f;border:none;color:#1a0f07;font-size:1.2rem;font-weight:700;cursor:pointer;}

.carrito-flotante{position:fixed;bottom:16px;left:16px;background:#e0a53f;color:#1a0f07;border:none;border-radius:24px;padding:10px 16px;display:none;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.4);z-index:30;font-weight:800;font-size:0.85rem;}
.carrito-flotante.visible{display:flex;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:40;}
.overlay.visible{display:block;}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:#241408;border-radius:20px 20px 0 0;z-index:50;display:none;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,0.5);}
.panel.visible{display:flex;}
.panel-header{padding:16px 18px;border-bottom:1px solid rgba(202,161,83,0.25);display:flex;justify-content:space-between;align-items:center;}
.panel-header h3{font-family:'Poppins',sans-serif;color:#caa153;font-size:1.05rem;}
.panel-cerrar{background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:1.4rem;cursor:pointer;}
.panel-body{padding:16px 18px;overflow-y:auto;flex:1;}
.panel-footer{padding:14px 18px 22px;border-top:1px solid rgba(202,161,83,0.25);}

.item-carrito{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.06);}
.item-carrito-info{flex:1;}
.item-carrito-nombre{font-weight:700;font-size:0.93rem;}
.item-carrito-precio{color:#e0a53f;font-size:0.85rem;margin-top:2px;}
.item-carrito-obs{width:100%;margin-top:6px;padding:7px 10px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.25);border-radius:8px;color:#fff;font-size:0.8rem;outline:none;}
.item-carrito-obs::placeholder{color:rgba(255,255,255,0.3);}
.qty-control{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(202,161,83,0.4);background:transparent;color:#caa153;font-size:1rem;cursor:pointer;}
.qty-val{min-width:18px;text-align:center;font-weight:700;}
.btn-quitar{background:transparent;border:none;color:rgba(255,100,100,0.7);font-size:0.78rem;cursor:pointer;margin-top:6px;}

.total-row{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:800;color:#fff;margin-bottom:14px;}
.btn-principal{width:100%;padding:15px;background:#e0a53f;border:none;border-radius:12px;color:#1a0f07;font-size:1.02rem;font-weight:700;letter-spacing:1px;cursor:pointer;}
.btn-secundario{width:100%;padding:13px;background:transparent;border:1px solid rgba(202,161,83,0.4);border-radius:12px;color:#f3e6d0;font-size:0.93rem;cursor:pointer;margin-top:10px;}

.tipo-pedido-opciones{display:flex;flex-direction:column;gap:10px;}
.tipo-pedido-btn{padding:16px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(202,161,83,0.3);color:#fff;text-align:left;cursor:pointer;}
.tipo-pedido-btn strong{font-family:'Poppins',sans-serif;display:block;color:#caa153;font-size:1rem;margin-bottom:3px;}
.tipo-pedido-btn span{font-size:0.8rem;color:rgba(201,184,154,0.75);}

.campo-grupo{margin-bottom:12px;}
.campo-grupo label{display:block;font-size:0.8rem;color:#caa153;margin-bottom:5px;}
.campo-grupo input,.campo-grupo select{width:100%;padding:11px 13px;background:rgba(255,255,255,0.07);border:1px solid rgba(202,161,83,0.4);border-radius:10px;color:#fff;font-size:0.93rem;outline:none;}
.campo-fila{display:flex;gap:8px;}
.campo-fila>select,.campo-fila>input{flex:1;width:auto;}

.confirmacion{text-align:center;padding:20px 10px;}
.confirmacion-icono{font-size:2.6rem;margin-bottom:10px;}
.confirmacion h3{font-family:'Poppins',sans-serif;color:#caa153;margin-bottom:8px;}
.confirmacion p{color:#f3e6d0;font-size:0.9rem;line-height:1.5;}

.vacio-msg{text-align:center;color:rgba(201,184,154,0.5);padding:30px 0;font-size:0.9rem;}

.puntos-aviso{font-size:0.75rem;color:rgba(201,184,154,0.7);margin-bottom:10px;line-height:1.4;}
.tarjeta-puntos{margin-bottom:14px;padding:10px 12px;background:rgba(202,161,83,0.08);border:1px solid rgba(202,161,83,0.25);border-radius:10px;}
.tarjeta-puntos-titulo{font-family:'Poppins',sans-serif;font-size:0.8rem;color:#caa153;font-weight:700;margin-bottom:6px;}
.tarjeta-puntos-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;justify-items:center;}
.punto-celda{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(202,161,83,0.5);background:transparent;}
.punto-celda.lleno{background:#e0a53f;border-color:transparent;}
.tarjeta-puntos-premio{margin-top:6px;font-size:0.75rem;color:#e0a53f;font-weight:700;}

.oferta-papas{text-align:center;padding:6px 4px 10px;}
.oferta-papas-img{width:120px;height:120px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(224,165,63,0.35),rgba(202,161,83,0.1));display:flex;align-items:center;justify-content:center;font-size:4.2rem;box-shadow:0 6px 20px rgba(202,161,83,0.25);}
.oferta-papas-texto{font-size:1.02rem;color:#f3e6d0;line-height:1.55;margin-bottom:10px;}
.oferta-papas-texto strong{color:#e0a53f;}
.oferta-papas-precio{font-size:1.3rem;font-weight:800;color:#e0a53f;}
.oferta-papas-botones{display:flex;gap:10px;}
.oferta-papas-botones .btn-principal,.oferta-papas-botones .btn-secundario{margin-top:0;}

/* Carrito real: ícono flotante + panel deslizable, mismo comportamiento en todos los tamaños de pantalla */
.layout{display:block;}
.contenido{max-width:640px;margin:0 auto;}
@media (min-width:900px){
  .layout{display:flex;align-items:flex-start;justify-content:center;max-width:1120px;margin:0 auto;padding:16px 16px 40px;}
  .contenido{max-width:640px;margin:0;}
  header{position:sticky;}
}
</style>
</head>
<body>

<div class="layout">
  <div class="contenido">
    <header>
      <div class="header-top">
        <div>
          <div class="header-titulo">DONDE EL GORDO</div>
          <div class="header-sub">MENÚ DIGITAL</div>
        </div>
        <button class="btn-admin" onclick="abrirAdmin()" title="Administrador">⚙️</button>
      </div>
      <div class="mesa-badge" id="mesa-badge" style="display:none;"></div>
      <div class="categorias" id="categorias"></div>
    </header>

    <main>
      <div id="seccion-recomendados">
        <div class="seccion-titulo">⭐ Recomendados</div>
        <div id="lista-recomendados"></div>
      </div>
      <div id="lista-productos"></div>
    </main>
  </div>

</div>

<div class="carrito-flotante" id="carrito-flotante" onclick="abrirCarrito()">
  🛒 <span id="carrito-flotante-info">0</span> · <span id="carrito-flotante-total">$0</span>
</div>

<!-- PANEL CARRITO -->
<div class="overlay" id="overlay-carrito" onclick="cerrarCarrito()"></div>
<div class="panel" id="panel-carrito">
  <div class="panel-header">
    <h3>🛒 Tu pedido</h3>
    <button class="panel-cerrar" onclick="cerrarCarrito()">×</button>
  </div>
  <div class="panel-body" id="panel-carrito-body"></div>
  <div class="panel-footer">
    <div class="puntos-aviso" id="puntos-aviso-panel"></div>
    <div class="tarjeta-puntos" id="tarjeta-puntos-panel"></div>
    <div class="total-row"><span>Total</span><span id="carrito-total">$0</span></div>
    <button class="btn-principal" onclick="irACheckout()">Hacer pedido</button>
  </div>
</div>

<!-- PANEL OFERTA DE PAPAS -->
<div class="overlay" id="overlay-papas" onclick="cerrarPapas()"></div>
<div class="panel" id="panel-papas">
  <div class="panel-header">
    <h3>🍟 ¿Un antojito más?</h3>
    <button class="panel-cerrar" onclick="cerrarPapas()">×</button>
  </div>
  <div class="panel-body" id="panel-papas-body"></div>
  <div class="panel-footer">
    <div class="oferta-papas-botones">
      <button class="btn-secundario" onclick="cerrarPapas()">No, gracias</button>
      <button class="btn-principal" onclick="confirmarPapa()">¡Sí, se me antoja! 🍟</button>
    </div>
  </div>
</div>

<!-- PANEL MESA Y MESERO (solo cuando no llega mesa por QR) -->
<div class="overlay" id="overlay-mesa" onclick="cerrarMesaMesero()"></div>
<div class="panel" id="panel-mesa">
  <div class="panel-header">
    <h3>🍽️ ¿Qué mesa atiendes?</h3>
    <button class="panel-cerrar" onclick="cerrarMesaMesero()">×</button>
  </div>
  <div class="panel-body">
    <div class="campo-grupo">
      <label>Número de mesa</label>
      <input type="number" id="mesa-numero" placeholder="Ej: 5" min="1" onblur="verificarMesa()">
    </div>
    <div class="campo-grupo">
      <label id="mesa-mesero-label">Nombre del mesero</label>
      <select id="mesa-mesero">
        <option value="">-- Selecciona tu nombre --</option>
      </select>
      <div class="mesa-nota" id="mesa-nota" style="display:none;"></div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn-principal" onclick="confirmarMesaMesero()">Confirmar pedido</button>
  </div>
</div>

<!-- PANEL TIPO DE PEDIDO -->
<div class="overlay" id="overlay-checkout" onclick="cerrarCheckout()"></div>
<div class="panel" id="panel-checkout">
  <div class="panel-header">
    <h3>¿Cómo quieres tu pedido?</h3>
    <button class="panel-cerrar" onclick="cerrarCheckout()">×</button>
  </div>
  <div class="panel-body">
    <div class="tipo-pedido-opciones">
      <button class="tipo-pedido-btn" onclick="elegirTipo('domicilio')">
        <strong>🛵 Domicilio</strong>
        <span>Te escribimos por WhatsApp para confirmar el recargo según tu zona, el Nequi y el tiempo de espera.</span>
      </button>
      <button class="tipo-pedido-btn" onclick="elegirTipo('local')">
        <strong>🍽️ En el local</strong>
        <span>Tu pedido pasa directo a cocina y queda pendiente de pago en caja.</span>
      </button>
    </div>
  </div>
</div>

<!-- PANEL DATOS DOMICILIO -->
<div class="overlay" id="overlay-domicilio" onclick="cerrarDomicilio()"></div>
<div class="panel" id="panel-domicilio">
  <div class="panel-header">
    <h3>🛵 Datos de entrega</h3>
    <button class="panel-cerrar" onclick="cerrarDomicilio()">×</button>
  </div>
  <div class="panel-body">
    <div class="campo-grupo">
      <label>Nombre</label>
      <input type="text" id="dom-nombre" placeholder="Su nombre completo">
    </div>
    <div class="campo-grupo">
      <label>Celular</label>
      <input type="tel" id="dom-celular" placeholder="Ej: 3001234567">
    </div>
    <div class="campo-grupo">
      <label>Dirección</label>
      <input type="text" id="dom-direccion" placeholder="Barrio, calle, referencia">
    </div>
    <div class="campo-grupo">
      <label>Fecha de nacimiento</label>
      <div class="campo-fila">
        <input type="number" id="dom-dia-nac" placeholder="Día" min="1" max="31">
        <select id="dom-mes-nac">
          <option value="">Mes</option>
          <option value="1">Enero</option>
          <option value="2">Febrero</option>
          <option value="3">Marzo</option>
          <option value="4">Abril</option>
          <option value="5">Mayo</option>
          <option value="6">Junio</option>
          <option value="7">Julio</option>
          <option value="8">Agosto</option>
          <option value="9">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>
        <input type="number" id="dom-anio-nac" placeholder="Año (ej: 1990)" min="1930" max="2026">
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn-principal" onclick="enviarDomicilio()">Enviar por WhatsApp</button>
  </div>
</div>

<!-- PANEL FIDELIZACION (solo Asesor de Ventas, primera ronda de una mesa nueva) -->
<div class="overlay" id="overlay-fidelizacion" onclick="cerrarFidelizacion()"></div>
<div class="panel" id="panel-fidelizacion">
  <div class="panel-header">
    <h3>🎖️ Datos del cliente (opcional)</h3>
    <button class="panel-cerrar" onclick="cerrarFidelizacion()">×</button>
  </div>
  <div class="panel-body">
    <div class="campo-grupo">
      <label>Celular</label>
      <input type="tel" id="fid-celular" placeholder="Ej: 3001234567">
    </div>
    <div class="campo-grupo">
      <label>Nombre</label>
      <input type="text" id="fid-nombre" placeholder="Nombre del cliente">
    </div>
    <div class="campo-grupo">
      <label>Fecha de nacimiento</label>
      <div class="campo-fila">
        <input type="number" id="fid-dia-nac" placeholder="Día" min="1" max="31">
        <select id="fid-mes-nac">
          <option value="">Mes</option>
          <option value="1">Enero</option>
          <option value="2">Febrero</option>
          <option value="3">Marzo</option>
          <option value="4">Abril</option>
          <option value="5">Mayo</option>
          <option value="6">Junio</option>
          <option value="7">Julio</option>
          <option value="8">Agosto</option>
          <option value="9">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>
        <input type="number" id="fid-anio-nac" placeholder="Año (ej: 1990)" min="1930" max="2026">
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn-principal" onclick="confirmarFidelizacionYPedido(true)">Guardar y confirmar</button>
    <button class="btn-secundario" onclick="confirmarFidelizacionYPedido(false)">Omitir y confirmar</button>
  </div>
</div>

<!-- PANEL CONFIRMACION LOCAL -->
<div class="overlay" id="overlay-confirmacion" onclick="cerrarConfirmacion()"></div>
<div class="panel" id="panel-confirmacion">
  <div class="panel-header">
    <h3>Pedido</h3>
    <button class="panel-cerrar" onclick="cerrarConfirmacion()">×</button>
  </div>
  <div class="panel-body">
    <div class="confirmacion" id="confirmacion-contenido"></div>
  </div>
</div>

<!-- PANEL ADMIN -->
<div class="overlay" id="overlay-admin" onclick="cerrarAdmin()"></div>
<div class="panel" id="panel-admin">
  <div class="panel-header">
    <h3>🔒 Modo administrador</h3>
    <button class="panel-cerrar" onclick="cerrarAdmin()">×</button>
  </div>
  <div class="panel-body">
    <div class="campo-grupo">
      <label>Contraseña</label>
      <input type="password" id="admin-password" placeholder="••••••">
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn-principal" onclick="validarAdmin()">Entrar</button>
  </div>
</div>

<script>

function normalizarTexto(s) {
  return (s || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

const INDICE_IMAGENES = {};
Object.keys(ARCHIVOS_IMAGEN_PRODUCTO).forEach(archivo => {
  const ruta = 'imagenes/' + encodeURIComponent(archivo);
  ARCHIVOS_IMAGEN_PRODUCTO[archivo].forEach(alias => {
    INDICE_IMAGENES[normalizarTexto(alias)] = ruta;
  });
});

function imagenParaProducto(p) {
  return INDICE_IMAGENES[normalizarTexto(p.producto)] || null;
}

let meseroQR = new URLSearchParams(window.location.search).get('mesero');

function renderMesaBadge() {
  const badge = document.getElementById('mesa-badge');
  if (mesaQR) {
    badge.textContent = `📍 Mesa ${mesaQR}`;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function formatoCOP(valor) {
  return '$' + Number(valor).toLocaleString('es-CO');
}

function guardarCarrito() {
  localStorage.setItem('zfood_carrito', JSON.stringify(carrito));
  // Solo se etiqueta el carrito con la mesa cuando viene del flujo asesor (mesa Y
  // mesero por URL) -- es el único flujo donde un mismo dispositivo pasa de mesa
  // en mesa, así que es el único con riesgo de facturar un carrito viejo a la
  // mesa equivocada. QR-only y Domicilio no lo necesitan (un dispositivo = una mesa).
  if (meseroQR) {
    localStorage.setItem('zfood_carrito_mesa', mesaQR);
  }
}

async function cargarProductos() {
  try {
    const res = await fetch(SCRIPT_URL + '?accion=listar_productos');
    const data = await res.json();
    if (data.ok && Array.isArray(data.productos) && data.productos.length > 0) {
      PRODUCTOS = data.productos;
      return;
    }
  } catch (e) {
    // Backend no disponible todavía — seguimos con los datos locales.
  }
  PRODUCTOS = MOCK_PRODUCTOS;
}

let EMPLEADOS = [];

async function cargarEmpleados() {
  try {
    const res = await fetch(SCRIPT_URL + '?accion=listar_empleados');
    const data = await res.json();
    if (data.ok && Array.isArray(data.empleados)) {
      EMPLEADOS = data.empleados;
    }
  } catch (e) {
    // Backend no disponible -- renderMeseroOptions() cae a texto libre.
  }
  renderMeseroOptions();
}

function renderMeseroOptions() {
  const el = document.getElementById('mesa-mesero');
  if (!el) return;
  if (EMPLEADOS.length === 0) {
    // Sin catálogo disponible: no bloqueamos el flujo, volvemos a campo de texto libre.
    if (el.tagName === 'SELECT') {
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'mesa-mesero';
      input.placeholder = 'Su nombre';
      el.replaceWith(input);
    }
    return;
  }
  if (el.tagName !== 'SELECT') return; // ya se reemplazó por texto libre, no hay nada que poblar
  el.innerHTML = '<option value="">-- Selecciona tu nombre --</option>' +
    EMPLEADOS.map(emp => `<option value="${emp.nombre.replace(/"/g, '&quot;')}">${emp.nombre}</option>`).join('');
}

function renderCategorias() {
  const presentes = [...new Set(PRODUCTOS.map(p => p.categoria))];
  const categorias = presentes.slice().sort((a, b) => {
    const ia = ORDEN_CATEGORIAS.indexOf(a);
    const ib = ORDEN_CATEGORIAS.indexOf(b);
    if (ia === -1 && ib === -1) return 0;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  if (!categoriaActiva || !categorias.includes(categoriaActiva)) {
    categoriaActiva = categorias[0];
  }
  const cont = document.getElementById('categorias');
  const scrollActual = cont.scrollLeft;
  cont.innerHTML = categorias.map(c => {
    const col = COLORES_CATEGORIA[c] || { bg: '#caa153', border: '#e6c07a' };
    const activa = c === categoriaActiva;
    const texto = (col.bg === '#caa153') ? '#1a0f07' : '#f3e6d0';
    return `<div class="cat-pill${activa ? ' activa' : ''}" data-cat="${c}" style="background:${col.bg};border-color:${col.border};color:${texto};" onclick="seleccionarCategoria('${c.replace(/'/g,"\\'")}')">${ICONOS_CATEGORIA[c] || '🍴'} ${c}</div>`;
  }).join('');
  cont.scrollLeft = scrollActual;
}

function seleccionarCategoria(cat) {
  categoriaActiva = cat;
  renderCategorias();
  renderProductos();
}

function renderRecomendados() {
  const recomendados = PRODUCTOS.filter(p => p.recomendado === true || p.recomendado === 'Si' || p.recomendado === 'Sí');
  const seccion = document.getElementById('seccion-recomendados');
  if (recomendados.length === 0) { seccion.style.display = 'none'; return; }
  seccion.style.display = 'block';
  document.getElementById('lista-recomendados').innerHTML = recomendados.map(renderCard).join('');
}

function renderProductos() {
  const lista = PRODUCTOS.filter(p => p.categoria === categoriaActiva);
  document.getElementById('lista-productos').innerHTML =
    `<div class="seccion-titulo">${ICONOS_CATEGORIA[categoriaActiva] || '🍴'} ${categoriaActiva}</div>` +
    (lista.length ? lista.map(renderCard).join('') : '<div class="vacio-msg">Sin productos en esta categoría.</div>');
}

function renderCard(p) {
  const idx = PRODUCTOS.indexOf(p);
  const col = COLORES_CATEGORIA[p.categoria] || { bg: '#caa153', border: '#e6c07a' };
  const foto = imagenParaProducto(p);
  const anillo = foto ? col.border : 'rgba(202,161,83,0.35)';
  return `<div class="producto-card${adminActivo ? ' admin-on' : ''}">
    <div class="producto-media" style="border-color:${anillo};">
      ${foto ? `<img src="${foto}" alt="${p.producto.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` : ''}
      <span class="producto-emoji"${foto ? ' style="display:none;"' : ''}>${ICONOS_CATEGORIA[p.categoria] || '🍴'}</span>
    </div>
    <div class="producto-info">
      <div class="producto-nombre">${p.producto}</div>
      ${p.descripcion ? `<div class="producto-desc">${p.descripcion}</div>` : ''}
      <div class="producto-precio-row">
        <span class="producto-precio" id="precio-${idx}">${formatoCOP(p.precio)}</span>
        <button class="precio-edit-btn" onclick="editarPrecio(${idx})">✏️ editar</button>
      </div>
    </div>
    <button class="btn-agregar" onclick="agregarAlCarrito(${idx})">+</button>
  </div>`;
}

function agregarAlCarrito(idx) {
  const p = PRODUCTOS[idx];
  const existente = carrito.find(i => i.producto === p.producto && i.categoria === p.categoria);
  if (existente) { existente.cantidad++; }
  else { carrito.push({producto: p.producto, categoria: p.categoria, precio: p.precio, cantidad: 1, observacion: ''}); }
  guardarCarrito();
  actualizarCarritoFlotante();
  renderCarrito();
  if (p.categoria === 'Hamburguesas' || p.categoria === 'Perros') {
    ofrecerPapas(p.categoria);
  }
}

let papaOfrecidaIdx = null;

function ofrecerPapas(categoriaOrigen) {
  const papa = PRODUCTOS.find(p => p.categoria === 'Papas' && p.producto.toLowerCase().includes('francesa'));
  if (!papa) return;
  papaOfrecidaIdx = PRODUCTOS.indexOf(papa);

  const esPerro = categoriaOrigen === 'Perros';
  const adjetivo = esPerro ? 'delicioso' : 'deliciosa';
  const sustantivo = esPerro ? 'perro caliente' : 'hamburguesa';

  document.getElementById('panel-papas-body').innerHTML = `
    <div class="oferta-papas">
      <div class="oferta-papas-img">🍟</div>
      <div class="oferta-papas-texto">¿Deseas acompañar tu ${adjetivo} ${sustantivo} con unas ricas <strong>papas a la francesa</strong>? 😋</div>
      <div class="oferta-papas-precio">${formatoCOP(papa.precio)}</div>
    </div>
  `;
  document.getElementById('overlay-papas').classList.add('visible');
  document.getElementById('panel-papas').classList.add('visible');
}

function confirmarPapa() {
  if (papaOfrecidaIdx !== null) agregarPapaYcerrar(papaOfrecidaIdx);
}

function agregarPapaYcerrar(idx) {
  const p = PRODUCTOS[idx];
  const existente = carrito.find(i => i.producto === p.producto && i.categoria === p.categoria);
  if (existente) { existente.cantidad++; }
  else { carrito.push({producto: p.producto, categoria: p.categoria, precio: p.precio, cantidad: 1, observacion: ''}); }
  guardarCarrito();
  actualizarCarritoFlotante();
  renderCarrito();
  cerrarPapas();
}

function renderCarrito() {

    ? '<div class="vacio-msg">Tu carrito está vacío</div>'
    : carrito.map((item, i) => `

let mesaAbiertaInfo = null;
let ultimaMesaVerificada = null;

async function verificarMesa() {
  const mesa = document.getElementById('mesa-numero').value.trim();
  // Evita repetir la verificación cuando el blur se dispara de nuevo por el
  // propio clic en "Confirmar pedido" (si no, esa segunda verificación resetea
  // mesaAbiertaInfo justo antes de que confirmarMesaMesero() lo lea).
  if (mesa === ultimaMesaVerificada) return;
  ultimaMesaVerificada = mesa;

  const meseroInput = document.getElementById('mesa-mesero');
  const label = document.getElementById('mesa-mesero-label');
  const nota = document.getElementById('mesa-nota');

  mesaAbiertaInfo = null;
  meseroInput.disabled = false;
  label.textContent = 'Nombre del mesero';
  nota.style.display = 'none';
  if (!mesa) return;

  try {
    const res = await fetch(SCRIPT_URL + '?accion=estado_mesa&mesa=' + encodeURIComponent(mesa));
    const data = await res.json();
    if (!data.ok) return;
    mesaAbiertaInfo = { abierta: data.abierta, mesero: data.mesero || '' };

    if (data.abierta && data.mesero) {
      // Setting .value on a <select> with no matching <option> is a silent no-op — if the
      // mesa was opened under a name that isn't (or no longer is) in the active Empleados
      // catalog, inject a one-off option so the assignment actually displays and submits.
      if (meseroInput.tagName === 'SELECT' && !EMPLEADOS.some(emp => emp.nombre === data.mesero)) {
        const opt = document.createElement('option');
        opt.value = data.mesero;
        opt.textContent = data.mesero;
        meseroInput.appendChild(opt);
      }
      meseroInput.value = data.mesero;
      meseroInput.disabled = true;
      label.textContent = 'Mesero asignado';
      nota.textContent = `📍 Esta mesa ya la está atendiendo ${data.mesero}. Los productos nuevos quedan a su nombre.`;
      nota.style.display = 'block';
    } else if (data.abierta && !data.mesero) {
      label.textContent = 'Nombre del mesero (opcional)';
      nota.textContent = '📍 Esta mesa sigue en autoservicio. Si la vas a atender, escribe tu nombre; si no, déjalo vacío.';
      nota.style.display = 'block';
    }
  } catch (e) {
    // Backend no disponible todavía — seguimos con el comportamiento normal (ambos campos requeridos).
  }
}

function confirmarMesaMesero() {
  const mesa = document.getElementById('mesa-numero').value.trim();
  const mesero = document.getElementById('mesa-mesero').value.trim();
  const meseroOpcional = mesaAbiertaInfo && mesaAbiertaInfo.abierta;
  if (!mesa || (!mesero && !meseroOpcional)) {
    alert('Por favor completa el número de mesa y el nombre del mesero');
    return;
  }
  cerrarMesaMesero();
  confirmarPedidoLocal(mesa, mesero);
}

/**
 * Flujo de "en el local" cuando mesa Y mesero llegan por URL (asesorventas.html).
 * Solo se pide fidelización si la mesa todavía no estaba abierta -- rondas
 * siguientes de la misma mesa van directo a confirmar, sin volver a preguntar.
 * Si no se puede verificar (sin conexión), se asume mesa nueva y se pide de
 * todas formas -- "Omitir" sigue disponible, así que nunca bloquea el pedido.
 */
let flujoAsesorEnCurso = false;

async function abrirFlujoLocalAsesor() {
  // Sin esto, un doble toque en "Hacer pedido" -> "En el local" dispara dos
  // veces esta función durante la ventana en que la primera todavía está
  // esperando la respuesta de estado_mesa (1-3s), y ambas terminan llamando a
  // confirmarPedidoLocal -- dos filas de pedido en Ventas por lo mismo.
  if (flujoAsesorEnCurso) return;
  flujoAsesorEnCurso = true;
  // Mismo overlay/mensaje que ya usa confirmarPedidoLocal ("Enviando tu
  // pedido...") -- así el catálogo y el botón flotante del carrito quedan
  // bloqueados visualmente durante todo el chequeo, igual que en ese otro flujo.
  const cont = document.getElementById('confirmacion-contenido');
  cont.innerHTML = `<div class="confirmacion-icono">⏳</div><h3>Verificando la mesa...</h3>`;
  document.getElementById('overlay-confirmacion').classList.add('visible');
  document.getElementById('panel-confirmacion').classList.add('visible');
  try {
    let abierta = false;
    let meseroExistente = '';
    try {
      const res = await fetch(SCRIPT_URL + '?accion=estado_mesa&mesa=' + encodeURIComponent(mesaQR));
      const data = await res.json();
      if (data.ok) { abierta = data.abierta; meseroExistente = data.mesero || ''; }
    } catch (e) {
      // Sin conexión para verificar -- se sigue con el flujo de fidelización igual.
    }
    if (abierta) {
      // Mismo aviso que ya existe en el panel manual (mesa-nota) cuando otro
      // mesero atiende la mesa -- aquí se muestra automático, sin que nadie
      // tenga que escribir ni tocar ningún campo para verlo.
      if (meseroExistente && meseroExistente !== meseroQR) {
        alert('📍 Esta mesa ya la está atendiendo ' + meseroExistente + '. Los productos nuevos quedan a su nombre.');
      }
      // Se espera a que termine (a diferencia de las otras llamadas a esta función,
      // que son "fire and forget") para mantener flujoAsesorEnCurso activo durante
      // todo el crear_pedido y así cerrar también la ventana de doble toque ahí.
      await confirmarPedidoLocal(mesaQR, meseroQR);
    } else {
      // El overlay de "Verificando..." no debe quedar atascado detrás del panel
      // de fidelización -- se cierra explícitamente antes de abrirlo.
      cerrarConfirmacion();
      abrirFidelizacion();
    }
  } finally {
    flujoAsesorEnCurso = false;
  }
}

  document.getElementById('fid-celular').value = '';
  document.getElementById('fid-nombre').value = '';
  document.getElementById('fid-dia-nac').value = '';
  document.getElementById('fid-mes-nac').value = '';
  document.getElementById('fid-anio-nac').value = '';
  document.getElementById('overlay-fidelizacion').classList.add('visible');
  document.getElementById('panel-fidelizacion').classList.add('visible');
}

function cerrarFidelizacion() {

  document.getElementById('panel-fidelizacion').classList.remove('visible');

/**
 * guardar=true guarda los datos en Clientes (reusando registrarClienteDesdeMenu,
 * sin dirección -- no aplica a mesa) antes de confirmar; guardar=false (Omitir)
 * confirma el pedido directamente. Cualquiera de los dos caminos siempre termina
 * en confirmarPedidoLocal -- nunca se bloquea el pedido por esto.
 */
function confirmarFidelizacionYPedido(guardar) {
  const celular = document.getElementById('fid-celular').value.trim();
  const nombre = document.getElementById('fid-nombre').value.trim();
  const diaNac = document.getElementById('fid-dia-nac').value.trim();
  const mesNac = document.getElementById('fid-mes-nac').value;
  const anioNac = document.getElementById('fid-anio-nac').value.trim();
  cerrarFidelizacion();
  if (guardar && celular) {
    const cumpleISO = (diaNac && mesNac && anioNac)
      ? `${anioNac}-${String(mesNac).padStart(2, '0')}-${String(diaNac).padStart(2, '0')}`
      : '';
    registrarClienteDesdeMenu(nombre, celular, cumpleISO, '');
  }
  confirmarPedidoLocal(mesaQR, meseroQR);
}

/**
 * Rellena nombre/celular/fecha de nacimiento con lo que el cliente ya escribió en
 * bienvenida.html (guardado ahí en localStorage, clave 'degCliente') para no
 * pedírselo dos veces. La dirección NUNCA se precarga a propósito — puede cambiar
 * de un pedido a otro, así que siempre se vuelve a pedir (y sigue siendo obligatoria
 * en enviarDomicilio()). Los campos precargados quedan editables por si el pedido
 * es para otra persona.
 */
function precargarDatosDomicilio() {
  let datos;
  try {
    datos = JSON.parse(localStorage.getItem('degCliente') || 'null');
  } catch (e) {
    datos = null;
  }
  if (!datos) return;

  if (datos.nombre) document.getElementById('dom-nombre').value = datos.nombre;
  if (datos.tel) document.getElementById('dom-celular').value = datos.tel;
  if (datos.cumple) {
    const partes = datos.cumple.split('-'); // 'YYYY-MM-DD'
    if (partes.length === 3) {
      document.getElementById('dom-anio-nac').value = partes[0];
      document.getElementById('dom-mes-nac').value = String(parseInt(partes[1], 10));
      document.getElementById('dom-dia-nac').value = String(parseInt(partes[2], 10));
    }
  }
}

function resumenPedidoTexto() {
  const lineas = carrito.map(i => `• ${i.cantidad}x ${i.producto}${i.observacion ? ' (' + i.observacion + ')' : ''} — ${formatoCOP(i.precio * i.cantidad)}`);
  const total = carrito.reduce((s, i) => s + i.cantidad * i.precio, 0);
  return {lineas, total};
}

const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function enviarDomicilio() {
  const nombre = document.getElementById('dom-nombre').value.trim();
  const celular = document.getElementById('dom-celular').value.trim();
  const direccion = document.getElementById('dom-direccion').value.trim();
  const diaNac = document.getElementById('dom-dia-nac').value.trim();
  const mesNac = document.getElementById('dom-mes-nac').value;
  const anioNac = document.getElementById('dom-anio-nac').value.trim();
  if (!nombre || !celular || !direccion) { alert('Por favor completa nombre, celular y dirección'); return; }

  const {lineas, total} = resumenPedidoTexto();
  const fechaNacTxt = mesNac ? `${diaNac ? diaNac + ' de ' : ''}${NOMBRES_MES[parseInt(mesNac, 10) - 1]}${anioNac ? ' de ' + anioNac : ''}` : '';

  const msgLineas = [
    `\u{1F6F5} *Pedido a domicilio - Donde el Gordo*`,
    ``,
    `Nombre: ${nombre}`,
    `Celular: ${celular}`,
    `Dirección: ${direccion}`
  ];
  if (fechaNacTxt) msgLineas.push(`Fecha de nacimiento: ${fechaNacTxt}`);
  msgLineas.push(``, ...lineas, ``, `Subtotal: ${formatoCOP(total)}`, `Recargo de domicilio: a confirmar según zona`);
  if (total >= 50000) msgLineas.push(`🎁 ¡Este pedido suma 1 punto en tu tarjeta de fidelidad!`);
  msgLineas.push(``, `Por favor confírmenme el Nequi para el pago y el tiempo de espera. ¡Gracias!`);
  const msg = msgLineas.join('\n');

  const url = `https://wa.me/${WHATSAPP_NEGOCIO}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  cerrarDomicilio();
  sumarPuntoSiAplica(total);
  const cumpleISO = (diaNac && mesNac && anioNac)
    ? `${anioNac}-${String(mesNac).padStart(2, '0')}-${String(diaNac).padStart(2, '0')}`
    : '';
  try {
    localStorage.setItem('degCliente', JSON.stringify({nombre, tel: celular, cumple: cumpleISO}));
  } catch (e) {}
  // Aviso en pantalla porque el pop-up de WhatsApp puede ser bloqueado por el
  // navegador o el cliente puede no tener WhatsApp instalado -- sin esto, el
  // panel de Domicilio simplemente se cerraba sin ninguna señal de que el
  // pedido se armó (hallazgo de pruebas 2026-08-04).
  document.getElementById('confirmacion-contenido').innerHTML =
    `<div class="confirmacion-icono">📲</div><h3>¡Pedido armado!</h3><p>Se abrió WhatsApp con tu pedido listo — confirma el envío ahí para completarlo. Si no se abrió, revisa que tu navegador no haya bloqueado la ventana.</p>`;
  document.getElementById('overlay-confirmacion').classList.add('visible');
  document.getElementById('panel-confirmacion').classList.add('visible');
  await registrarVentaEnSheet('domicilio', total);
  await registrarClienteDesdeMenu(nombre, celular, cumpleISO, direccion);
  carrito = [];
  guardarCarrito();
  actualizarCarritoFlotante();
  renderCarrito();
}

/**
 * Guarda o actualiza al cliente en la hoja Clientes, reusando las mismas acciones
 * que ya usa bienvenida.html (buscar_cliente/registrar_cliente/actualizar_cliente).
 * Antes, el nombre/celular/cumpleaños/dirección del checkout de Domicilio solo se
 * enviaban por WhatsApp y se perdían — no quedaban en ningún Sheet (hallazgo de
 * pruebas 2026-07-22). La dirección se reenvía también al actualizar un cliente ya
 * existente porque puede cambiar de un pedido a otro (se guarda la más reciente).
 * Igual que registrarVentaEnSheet, no bloquea ni le muestra error al cliente si
 * falla — el pedido ya se confirmó por WhatsApp de todas formas.
 */
async function registrarClienteDesdeMenu(nombre, celular, cumpleISO, direccion) {
  try {
    const res = await fetch(SCRIPT_URL + '?accion=buscar_cliente&telefono=' + encodeURIComponent(celular));
    const data = await res.json();
    if (data.ok && data.existe) {
      const params = new URLSearchParams({ accion: 'actualizar_cliente', telefono: celular, direccion: direccion });
      await fetch(SCRIPT_URL + '?' + params.toString());
    } else {
      const params = new URLSearchParams({
        accion: 'registrar_cliente',
        telefono: celular,
        nombre: nombre,
        cumpleanos: cumpleISO,
        canal: 'menu',
        direccion: direccion
      });
      await fetch(SCRIPT_URL + '?' + params.toString());
    }
  } catch (e) {
    // Backend no disponible, o sin conexión — no se le muestra error al cliente por esto.
  }
}

/**
 * Registra la venta en la hoja Ventas vía crear_pedido, sin bloquear el flujo de
 * WhatsApp si falla (el pedido de Domicilio ya se confirma por WhatsApp de todas
 * formas). Antes, Domicilio no tocaba el sistema — ahora sí queda como venta,
 * igual que "en el local", para que el inventario descuente insumos automáticamente
 * sin depender de que alguien vuelva a digitar la tirilla (decisión 2026-07-16).
 */
async function registrarVentaEnSheet(tipo, total) {
  try {
    const params = new URLSearchParams({
      accion: 'crear_pedido',
      items: JSON.stringify(carrito),
      total: String(total),
      tipo: tipo
    });
    await fetch(SCRIPT_URL + '?' + params.toString());
  } catch (e) {
    // Backend no disponible todavía, o sin conexión — el pedido ya se confirmó por
    // WhatsApp, así que no se le muestra ningún error al cliente por esto.
  }
}

async function confirmarPedidoLocal(mesa, mesero) {
  const {lineas, total} = resumenPedidoTexto();
  const cont = document.getElementById('confirmacion-contenido');
  cont.innerHTML = `<div class="confirmacion-icono">⏳</div><h3>Enviando tu pedido...</h3>`;
  document.getElementById('overlay-confirmacion').classList.add('visible');
  document.getElementById('panel-confirmacion').classList.add('visible');

  try {
    const params = new URLSearchParams({
      accion: 'crear_pedido',
      items: JSON.stringify(carrito),
      total: String(total),
      tipo: 'local',
      mesa: String(mesa || ''),
      mesero: mesero || ''
    });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (data.ok) {
      const mesaTxt = mesa ? ` (Mesa ${mesa})` : '';
      cont.innerHTML = `<div class="confirmacion-icono">✅</div><h3>¡Pedido enviado!${mesaTxt}</h3><p>Tu pedido ya está en cocina y quedó pendiente de pago en caja. ¡Gracias por tu compra!</p>`;
      sumarPuntoSiAplica(total);
      carrito = [];
      guardarCarrito();
      actualizarCarritoFlotante();
      renderCarrito();
    } else {
      throw new Error('respuesta no ok');
    }
  } catch (e) {
    cont.innerHTML = `<div class="confirmacion-icono">⚠️</div><h3>Todavía no podemos enviar el pedido</h3><p>La conexión con cocina/caja no está lista aún (falta desplegar la acción <code>crear_pedido</code> en Apps Script). Por ahora puedes hacer tu pedido por WhatsApp.</p>`;
  }
}

async function validarAdmin() {
  const pass = document.getElementById('admin-password').value;
  try {
    const res = await fetch(SCRIPT_URL + '?accion=verificar_admin&clave=' + encodeURIComponent(pass));
    const data = await res.json();
    if (data.ok && data.valido) {
      const sesionRes = await fetch('/api/session');
      const sesionData = await sesionRes.json();
      if (sesionData.rol !== 'admin') {
        alert('Para editar precios primero debes iniciar sesión como Admin.');
        window.location.href = '/login.html?volver=' + encodeURIComponent('/menu.html');
        return;
      }
      adminActivo = true;
      adminClave = pass; // se reenvía en cada edición de precio para que el script la valide de nuevo
      cerrarAdmin();
      renderProductos();
      renderRecomendados();
    } else {
      alert('Contraseña incorrecta.');
    }
  } catch (e) {
    alert('No se pudo verificar la contraseña — la acción "verificar_admin" todavía no está desplegada en Apps Script.');
  }
}

async function editarPrecio(idx) {
  const p = PRODUCTOS[idx];
  const nuevo = prompt(`Nuevo precio para "${p.producto}" (actual: ${formatoCOP(p.precio)})`, p.precio);
  if (nuevo === null) return;
  const nuevoNum = parseInt(nuevo.replace(/[^0-9]/g, ''), 10);
  if (isNaN(nuevoNum)) { alert('Precio inválido'); return; }

  try {
    const params = new URLSearchParams({
      accion: 'actualizar_precio',
      producto: p.producto,
      categoria: p.categoria,
      precio: String(nuevoNum),
      clave: adminClave
    });
    const res = await fetch(SCRIPT_URL + '?' + params.toString());
    const data = await res.json();
    if (data.ok) {
      p.precio = nuevoNum;
      document.getElementById('precio-' + idx).textContent = formatoCOP(nuevoNum);
    } else {
      throw new Error('respuesta no ok');
    }
  } catch (e) {
    alert('No se pudo actualizar el precio — puede que tu sesión de Admin haya expirado o no hayas iniciado sesión. Ve a /login.html e inicia sesión como Admin.');
  }
}

(async function init() {
  // Riesgo de facturación cruzada: en el flujo asesor un mismo teléfono pasa de
  // mesa en mesa (asesorventas.html). Si el mesero abrió la Mesa 5, agregó
  // productos y abandonó ese pedido sin confirmarlo (falla de red, cambió de
  // idea, cerró el panel de fidelización tocando fuera), el carrito viejo sigue
  // en localStorage y se facturaría en silencio a la Mesa 7 en cuanto la abra.
  // Si el carrito guardado quedó etiquetado con una mesa distinta a la actual,
  // se descarta automáticamente -- más seguro que preguntar con confirm(), y
  // consistente con que este archivo nunca usa confirm() (solo alert() para avisos).
  if (meseroQR && mesaQR !== null) {
    const carritoMesaGuardada = localStorage.getItem('zfood_carrito_mesa');
    if (carrito.length > 0 && carritoMesaGuardada !== mesaQR) {
      alert(`Había un pedido sin enviar de otra mesa (Mesa ${carritoMesaGuardada || '?'}). Se vació el carrito para no facturarlo por error a la Mesa ${mesaQR}.`);
      carrito = [];
      guardarCarrito();
    }
  }
  renderMesaBadge();
  await cargarProductos();
  await cargarEmpleados();
  renderCategorias();
  renderRecomendados();
  renderProductos();
  actualizarCarritoFlotante();
  renderCarrito();
  renderTarjetaPuntos();
})();
</script>
